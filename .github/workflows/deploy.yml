name: Manual Hard Sync (ArgoCD)

# This workflow is an escape hatch for forcing an ArgoCD sync
# or for rollback. Normal deployments flow through build-push.yml → Git → ArgoCD.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Roll back to this image tag (leave empty to sync HEAD)"
        required: false
      force_sync:
        description: "Force ArgoCD hard refresh + sync"
        type: boolean
        default: false

jobs:
  rollback-or-sync:
    name: Rollback / Hard Sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install kustomize
        if: ${{ inputs.image_tag != '' }}
        uses: imranismail/setup-kustomize@v2

      - name: Roll back image tag in overlay
        if: ${{ inputs.image_tag != '' }}
        working-directory: k8s/overlays/production
        run: |
          TAG="${{ inputs.image_tag }}"
          ACR="${{ secrets.ACR_LOGIN_SERVER }}"
          kustomize edit set image "PLACEHOLDER_ACR/backend=${ACR}/backend:${TAG}"
          kustomize edit set image "PLACEHOLDER_ACR/frontend=${ACR}/frontend:${TAG}"

      - name: Commit rollback to Git
        if: ${{ inputs.image_tag != '' }}
        run: |
          TAG="${{ inputs.image_tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          git commit -m "chore(rollback): revert images to ${TAG} [skip ci]"
          git push

      - name: Azure Login
        if: ${{ inputs.force_sync }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials & hard-refresh ArgoCD
        if: ${{ inputs.force_sync }}
        run: |
          az aks get-credentials \
            --resource-group "${{ secrets.AKS_RESOURCE_GROUP }}" \
            --name "${{ secrets.AKS_CLUSTER_NAME }}" \
            --overwrite-existing

          # Port-forward ArgoCD server and trigger a hard refresh
          kubectl port-forward svc/argocd-server 8080:443 -n argocd &
          sleep 5

          # Login with admin token from secret
          ARGOCD_PWD=$(kubectl get secret argocd-initial-admin-secret \
            -n argocd -o jsonpath='{.data.password}' | base64 -d)

          argocd login localhost:8080 \
            --username admin --password "$ARGOCD_PWD" --insecure

          argocd app sync peerisland --force --hard-refresh
          argocd app wait peerisland --health --timeout 300
