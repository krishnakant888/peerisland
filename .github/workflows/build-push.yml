name: Build, Push & Update Image Tag

on:
  push:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag override (defaults to git SHA)"
        required: false

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        service: [frontend, backend]

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.sha }}"
          echo "tag=${TAG:0:8}" >> "$GITHUB_OUTPUT"

      - name: Azure Login (OIDC — no stored secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "${{ secrets.ACR_NAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: app/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Scan image (Trivy — block on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"

  # GitOps step: update the image tag in the overlay and push to Git.
  # ArgoCD detects the commit and syncs — no kubectl in this pipeline.
  update-image-tag:
    name: Update image tag in overlay
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needs to push the tag commit

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image tags in production overlay
        working-directory: k8s/overlays/production
        run: |
          TAG="${{ needs.build.outputs.image_tag }}"
          ACR="${{ env.ACR_LOGIN_SERVER }}"

          kustomize edit set image \
            "PLACEHOLDER_ACR/backend=${ACR}/backend:${TAG}"

          kustomize edit set image \
            "PLACEHOLDER_ACR/frontend=${ACR}/frontend:${TAG}"

          echo "Updated images to tag: ${TAG}"
          cat kustomization.yaml

      - name: Commit and push updated overlay
        run: |
          TAG="${{ needs.build.outputs.image_tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          git commit -m "chore(deploy): bump images to ${TAG} [skip ci]"
          git push

      # ArgoCD is watching k8s/overlays/production on main.
      # The push above triggers a webhook (if configured) or ArgoCD's poll interval,
      # and it syncs the new image tags to the cluster automatically.
