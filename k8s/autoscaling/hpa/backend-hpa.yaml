# ── HorizontalPodAutoscaler for the backend ───────────────────────────────────
#
# Scales on CPU and Memory — both are native Resource metrics served by
# metrics-server, so no prometheus-adapter or custom metric setup is needed.
#
# WHY no memory metric conflict with VPA?
#   VPA (Vertical Pod Autoscaler) is set to RequestsOnly — it adjusts the
#   resource *request* value, not the limit.  HPA measures utilisation as
#   (actual usage / request).  When VPA changes the request, the utilisation
#   ratio re-normalises automatically, so both controllers converge rather than
#   fight: VPA right-sizes the request, HPA reacts to actual load relative to it.
#
# IMPORTANT: scaleTargetRef points at a Rollout, not a Deployment.
#   This stack uses Argo Rollouts for BlueGreen deployments.
#   HPA must target argoproj.io/v1alpha1 Rollout or it silently does nothing.
#
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: peerisland
  labels:
    app: backend
    component: autoscaling
spec:
  # Target the Argo Rollout, not a plain Deployment
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: backend

  minReplicas: 2   # never below 2 — single-replica means a restart drops all traffic
  maxReplicas: 20  # hard ceiling to prevent runaway cost during traffic spikes

  metrics:
    # ── Metric 1: CPU utilization ─────────────────────────────────────────────
    # Primary scale trigger. 70% of the VPA-managed CPU request is the threshold —
    # leaves headroom for request bursts before latency degrades.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # ── Metric 2: Memory utilization ──────────────────────────────────────────
    # Secondary trigger. Node.js apps can hold large in-memory caches; scaling
    # out before hitting OOM avoids pod restarts under heavy load.
    # 80% threshold: higher than CPU because memory growth is more gradual and
    # a brief spike rarely needs a new pod the way a CPU spike does.
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  # ── Scaling behaviour ─────────────────────────────────────────────────────
  behavior:
    scaleUp:
      # 30s stabilisation: rapid response to traffic spikes.
      stabilizationWindowSeconds: 30
      policies:
        # Double capacity in 15s if the signal is very strong
        - type: Percent
          value: 100
          periodSeconds: 15
        # Or add up to 4 pods per minute — whichever is larger (selectPolicy: Max)
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max   # be aggressive on scale-up; latency hurts users

    scaleDown:
      # 300s (5 min) stabilisation before removing pods.
      # Prevents flapping after a brief traffic lull.
      stabilizationWindowSeconds: 300
      policies:
        # Remove at most 10% of fleet per minute
        - type: Percent
          value: 10
          periodSeconds: 60
        # Or at most 2 pods per minute — whichever is SMALLER (selectPolicy: Min)
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Min   # be conservative on scale-down; avoid cold-start latency
