# ── HorizontalPodAutoscaler for the frontend ──────────────────────────────────
#
# Scales on CPU and Memory — native Resource metrics via metrics-server.
# No prometheus-adapter or custom metric setup required.
#
# Frontend is a static file server (nginx). CPU spikes under high concurrency
# and memory grows with open connections, making both good scale signals.
#
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: peerisland
  labels:
    app: frontend
    component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: frontend

  minReplicas: 2   # always HA — single replica = SPOF
  maxReplicas: 10  # nginx scales efficiently; fewer pods needed than backend

  metrics:
    # ── Metric 1: CPU utilization ─────────────────────────────────────────────
    # nginx is CPU-bound under high concurrency (TLS handshakes, compression).
    # 70% threshold matches backend for consistency.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # ── Metric 2: Memory utilization ──────────────────────────────────────────
    # nginx buffers connections in memory; 80% signals connection pressure
    # before OOM restarts occur.
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  # ── Scaling behaviour ─────────────────────────────────────────────────────
  behavior:
    scaleUp:
      # 60s stabilisation (more conservative than backend).
      # nginx pods start near-instantly so we can afford to wait slightly longer
      # and avoid reacting to brief spikes.
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60   # add at most 2 pods per minute
      selectPolicy: Max

    scaleDown:
      # 5-minute window before removing pods.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120   # remove at most 1 pod every 2 minutes
      selectPolicy: Min
