# ── Frontend Preview Service (BlueGreen — green/new traffic) ─────────────────
#
# PURPOSE: Same BlueGreen pattern as backend-preview but for the frontend Rollout.
#   Routes /preview traffic to the new (green) frontend version.
#   Returns 503 when no rollout is in progress (Rollouts points selector to no pods).

apiVersion: v1
kind: Service
metadata:
  name: frontend-preview
  namespace: peerisland
  labels:
    app: frontend
    role: preview
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
  type: ClusterIP
