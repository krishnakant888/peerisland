# ── Frontend Active Service (BlueGreen — production traffic) ─────────────────
#
# PURPOSE: Same BlueGreen pattern as backend-active but for the frontend Rollout.
#   Receives 100% of production UI traffic from the Ingress (/ path).
#   Rollouts updates this selector to green pods only after explicit promotion.
#
# Frontend runs on targetPort 3000 (Next.js / nginx). Port 80 externally.

apiVersion: v1
kind: Service
metadata:
  name: frontend-active
  namespace: peerisland
  labels:
    app: frontend
    role: active
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
  type: ClusterIP
