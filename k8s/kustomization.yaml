apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - monitoring-namespace.yaml   # ensures monitoring ns has the correct label for NetworkPolicy
  - serviceaccount.yaml
  - network-policy.yaml
  - backend/rollout.yaml
  - backend/service.yaml
  - backend/active-service.yaml
  - backend/preview-service.yaml
  - frontend/rollout.yaml
  - frontend/service.yaml
  - frontend/active-service.yaml
  - frontend/preview-service.yaml
  - ingress.yaml
  - autoscaling/   # HPA + VPA + PDB — requires VPA CRDs (make install-vpa)
  - monitoring/    # Tempo, OTLP service, SecretProviderClass, PrometheusRule
