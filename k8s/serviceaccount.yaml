# ── ServiceAccount: peerisland-sa ────────────────────────────────────────────
#
# PURPOSE: Creates the ServiceAccount used by backend and frontend pods.
#   Both Rollout specs reference this SA in their pod template.
#
# automountServiceAccountToken: false — by default, Kubernetes mounts the SA
#   token as a secret into every pod. Backend/frontend don't need to call the
#   Kubernetes API, so mounting the token is unnecessary attack surface:
#   if a pod is compromised, the token can't be used to pivot to k8s API.
#
# WORKLOAD IDENTITY NOTE: If we later need pods to access Azure resources
#   (e.g., read blobs directly), we'd annotate this SA with the OIDC federation
#   annotation (azure.workload.identity/client-id: <managed-identity-client-id>)
#   and set automountServiceAccountToken: true for the OIDC flow to work.
#   For now it stays false — principle of least privilege.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: peerisland-sa
  namespace: peerisland
  labels:
    app.kubernetes.io/managed-by: kubectl
automountServiceAccountToken: false
