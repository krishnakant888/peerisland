# ── UAT overlay ───────────────────────────────────────────────────────────────
# Uncomment and wire up when a UAT environment is provisioned.
# To activate:
#   1. Create a UAT AKS cluster / namespace via Terraform (var.environment = "uat")
#   2. Add an ArgoCD Application pointing to k8s/overlays/uat/
#   3. Update ACR name and image tags below
#   4. Uncomment this entire file (remove the block comment markers)
#
# UAT intent: production-like config (same replicas, same resources) but
# pointed at a separate hostname and namespace for acceptance testing.
#
# <!--
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base/

# ArgoCD / CI updates these image tags via:
#   kustomize edit set image PLACEHOLDER_ACR/backend=<acr>/<repo>:<sha>
images:
- name: PLACEHOLDER_ACR/backend
  newName: peerislanduatacr.azurecr.io/backend
  newTag: latest
- name: PLACEHOLDER_ACR/frontend
  newName: peerislanduatacr.azurecr.io/frontend
  newTag: latest

# UAT patches — production-like replica count for realistic load testing
patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
  target:
    kind: Rollout
    name: backend
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
  target:
    kind: Rollout
    name: frontend

# Point ingress to UAT hostname
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: uat.peerisland.centralindia.cloudapp.azure.com
    - op: replace
      path: /spec/tls/0/hosts/0
      value: uat.peerisland.centralindia.cloudapp.azure.com
    - op: replace
      path: /spec/tls/0/secretName
      value: peerisland-uat-tls
  target:
    kind: Ingress
    name: peerisland-ingress

labels:
- pairs:
    environment: uat
    managed-by: argocd
# -->
