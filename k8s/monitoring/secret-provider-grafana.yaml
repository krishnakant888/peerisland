# ── CSI SecretProviderClass: Grafana Admin Credentials ───────────────────────
#
# PURPOSE: Bridges Azure Key Vault and the Kubernetes Secret API — it tells the
#   CSI Secrets Store driver to pull grafana-admin-user and grafana-admin-password
#   from Key Vault and write them into a k8s Secret named grafana-admin-secret.
#
# SECURITY DESIGN:
#   The Grafana admin password is NOT in git (it's in Key Vault).
#   It's NOT a manually created k8s Secret (would need manual rotation).
#   It's auto-synced via the CSI driver whenever Key Vault is updated.
#   This is the Workload Identity flow: AKS uses OIDC federation to authenticate
#   to Key Vault — no static credentials needed anywhere.
#
# HOW THE SYNC WORKS:
#   1. A pod in the monitoring namespace mounts this SecretProviderClass as a volume
#   2. The CSI driver authenticates to Key Vault using the clientID managed identity
#   3. It reads the two secrets from Key Vault
#   4. The secretObjects block writes them to k8s Secret "grafana-admin-secret"
#   5. Grafana reads that Secret via admin.existingSecret in grafana-values.yaml
#
# WHICH POD TRIGGERS THE SYNC?
#   Grafana's own pod mounts the SecretProviderClass — the volume mount triggers
#   the CSI driver on pod startup. The k8s Secret is created/updated at that point.
#
# Key Vault setup (run once per environment):
#   az keyvault secret set --vault-name <KV_NAME> --name grafana-admin-user     --value admin
#   az keyvault secret set --vault-name <KV_NAME> --name grafana-admin-password --value <STRONG_PASSWORD>
#
# Syncs grafana-admin-secret from Azure Key Vault via CSI Secrets Store driver.
# Requires: AKS key_vault_secrets_provider addon + workload identity on the SA.
#
# Key Vault setup (run once):
#   az keyvault secret set --vault-name <KV_NAME> --name grafana-admin-user     --value admin
#   az keyvault secret set --vault-name <KV_NAME> --name grafana-admin-password --value <STRONG_PASSWORD>
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grafana-admin-keyvault
  namespace: monitoring
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "432712fe-53ea-443b-a1ba-3dde77009cc2"   # AKS Key Vault CSI addon managed identity
    keyvaultName: "peerisland-prod-kv-sqxc"
    tenantId: "82b7ce89-b6c9-4513-b99b-d6c6e15f003b"
    objects: |
      array:
        - |
          objectName: grafana-admin-user
          objectType: secret
        - |
          objectName: grafana-admin-password
          objectType: secret
  secretObjects:
    - secretName: grafana-admin-secret
      type: Opaque
      data:
        - objectName: grafana-admin-user
          key: admin-user
        - objectName: grafana-admin-password
          key: admin-password
