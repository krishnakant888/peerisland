# Syncs grafana-admin-secret from Azure Key Vault via CSI Secrets Store driver.
# Requires: AKS key_vault_secrets_provider addon + workload identity on the SA.
#
# Key Vault setup (run once):
#   az keyvault secret set --vault-name <KV_NAME> --name grafana-admin-user     --value admin
#   az keyvault secret set --vault-name <KV_NAME> --name grafana-admin-password --value <STRONG_PASSWORD>
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grafana-admin-keyvault
  namespace: monitoring
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: ""   # replaced by workload identity annotation on SA below
    keyvaultName: ""   # REPLACE: your Key Vault name
    tenantId:  ""      # REPLACE: your Azure tenant ID
    objects: |
      array:
        - |
          objectName: grafana-admin-user
          objectType: secret
        - |
          objectName: grafana-admin-password
          objectType: secret
  secretObjects:
    - secretName: grafana-admin-secret
      type: Opaque
      data:
        - objectName: grafana-admin-user
          key: admin-user
        - objectName: grafana-admin-password
          key: admin-password
