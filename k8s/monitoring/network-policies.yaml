# NetworkPolicies for the monitoring namespace.
# Default deny-all comes from the namespace having no permissive policy —
# these rules open exactly what each component needs.
---
# Grafana sidecar watches ConfigMaps/Secrets from the Kubernetes API server
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-apiserver-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes: [Egress]
  egress:
    - ports:
        - {port: 443,  protocol: TCP}
        - {port: 6443, protocol: TCP}
---
# Alloy needs to reach the API server (:443/:6443) and every node's kubelet (:10250)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alloy-apiserver-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes: [Egress]
  egress:
    - ports:
        - {port: 443,   protocol: TCP}
        - {port: 6443,  protocol: TCP}
        - {port: 10250, protocol: TCP}   # kubelet / cAdvisor
---
# Alloy scrapes pods in every namespace — allow egress to anywhere
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alloy-scrape-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
---
# OTLP ingress from the peerisland application namespace (backend → Alloy)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otlp-from-peerisland
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: peerisland
      ports:
        - {port: 4317, protocol: TCP}
        - {port: 4318, protocol: TCP}
---
# Allow DNS from monitoring namespace (required for all pods)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-dns
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
---
# Allow intra-namespace traffic (Alloy → Mimir/Loki/Tempo, Grafana → Mimir/Loki/Tempo)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-intra
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
# Allow Grafana ingress from NGINX ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - {port: 3000, protocol: TCP}
---
# Allow kube-apiserver to reach prometheus-adapter on port 6443 (APIService discovery)
# The AKS control plane has no namespace/pod selector — must allow from anywhere.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-adapter-apiserver
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-adapter
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 6443, protocol: TCP}
---
# Allow Prometheus scraping of monitoring stack self-metrics from Alloy (which is also in monitoring)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - {port: 3100, protocol: TCP}   # Loki / Tempo HTTP
        - {port: 3200, protocol: TCP}   # Tempo HTTP
        - {port: 8080, protocol: TCP}   # Mimir HTTP
        - {port: 12345, protocol: TCP}  # Alloy self-metrics
