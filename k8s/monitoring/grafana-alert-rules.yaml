              severity: warning
              team: platform
            isPaused: false

          - uid: alloy-daemonset-not-ready
            title: AlloyDaemonSetNotReady
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 300, to: 0}
                model:
                  expr: |
                    kube_daemonset_status_number_ready{namespace="monitoring",daemonset="alloy"}
                    /
                    kube_daemonset_status_desired_number_scheduled{namespace="monitoring",daemonset="alloy"} < 0.5
                  instant: true
                  refId: A
            for: 10m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Less than 50% of Alloy pods are ready"
              description: "Nodes with unhealthy Alloy pods will stop sending metrics and logs."
              runbook: "docs/runbooks/peerisland.md#alloy-not-ready"
            labels:
              severity: critical
              team: platform
            isPaused: false

          - uid: argocd-out-of-sync
            title: ArgoCDAppOutOfSync
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 600, to: 0}
                model:
                  expr: 'argocd_app_info{sync_status="OutOfSync"} == 1'
                  instant: true
                  refId: A
            for: 10m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "ArgoCD app {{ $labels.name }} is OutOfSync"
              description: "App has been OutOfSync for >10 min. Check ArgoCD UI or run argocd app sync {{ $labels.name }}."
              runbook: "docs/runbooks/peerisland.md#argocd-out-of-sync"
            labels:
              severity: warning
              team: platform
            isPaused: false

          - uid: argocd-sync-failed
            title: ArgoCDAppSyncFailed
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 300, to: 0}
                model:
                  expr: 'argocd_app_info{operation_phase=~"Error|Failed"} == 1'
                  instant: true
                  refId: A
            for: 5m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "ArgoCD app {{ $labels.name }} sync failed"
              description: "Last sync phase={{ $labels.operation_phase }}. Check ArgoCD for the error message."
              runbook: "docs/runbooks/peerisland.md#argocd-sync-failed"
            labels:
              severity: critical
              team: platform
            isPaused: false

          - uid: argocd-global-rpc-error
            title: ArgoCDGlobalRPCError
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 300, to: 0}
                model:
                  expr: |
                    (count(argocd_app_info{health_status="Unknown"}) / count(argocd_app_info)) > 0.4
                  instant: true
                  refId: A
            for: 2m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "ArgoCD global RPC error — {{ $value | humanizePercentage }} of apps Unknown"
              description: "Stale gRPC connections after repo-server restart. Fix: kubectl rollout restart statefulset argocd-application-controller -n argocd"
              runbook: "docs/runbooks/peerisland.md#argocd-rpc-error"
            labels:
              severity: critical
              team: platform
            isPaused: false

          - uid: argocd-repo-server-oom
            title: ArgoCDRepoServerRestarting
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 1800, to: 0}
                model:
                  expr: 'increase(kube_pod_container_status_restarts_total{namespace="argocd",container="argocd-repo-server"}[30m]) > 1'
                  instant: true
                  refId: A
            for: 0s
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "ArgoCD repo-server restarted {{ $value | humanize }} times in 30 min"
              description: "Likely OOMKilled. Triggers global RPC errors. Fix: increase repoServer.resources.limits.memory in argocd-values.yaml."
              runbook: "docs/runbooks/peerisland.md#argocd-repo-server-oom"
            labels:
              severity: critical
              team: platform
            isPaused: false

          - uid: argocd-repo-server-high-memory
            title: ArgoCDRepoServerHighMemory
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 300, to: 0}
                model:
                  expr: 'container_memory_working_set_bytes{namespace="argocd",container="argocd-repo-server"} > 471859200'
                  instant: true
                  refId: A
            for: 5m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "ArgoCD repo-server memory >450Mi on {{ $labels.pod }}"
              description: "Memory is {{ $value | humanize1024 }}. Limit is 512Mi — close to OOM. Consider raising the limit."
              runbook: "docs/runbooks/peerisland.md#argocd-repo-server-oom"
            labels:
              severity: warning
              team: platform
            isPaused: false

          - uid: argocd-repo-server-high-cpu
            title: ArgoCDRepoServerHighCPU
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 600, to: 0}
                model:
                  expr: 'rate(container_cpu_usage_seconds_total{namespace="argocd",container="argocd-repo-server"}[5m]) > 0.8'
                  instant: true
                  refId: A
            for: 10m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "ArgoCD repo-server CPU >80% on {{ $labels.pod }}"
              description: "High CPU during large syncs can cause manifest timeouts."
              runbook: "docs/runbooks/peerisland.md#argocd-repo-server-oom"
            labels:
              severity: warning
              team: platform
            isPaused: false

          - uid: argocd-controller-high-memory
            title: ArgoCDControllerHighMemory
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 300, to: 0}
                model:
                  expr: 'container_memory_working_set_bytes{namespace="argocd",container="argocd-application-controller"} > 891289600'
                  instant: true
                  refId: A
            for: 5m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "ArgoCD application-controller memory >850Mi"
              description: "Memory is {{ $value | humanize1024 }}. Limit is 1Gi — approaching OOM."
              runbook: "docs/runbooks/peerisland.md#argocd-controller-oom"
            labels:
              severity: warning
              team: platform
            isPaused: false

          - uid: argocd-controller-oom
            title: ArgoCDControllerRestarting
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 1800, to: 0}
                model:
                  expr: 'increase(kube_pod_container_status_restarts_total{namespace="argocd",container="argocd-application-controller"}[30m]) > 0'
                  instant: true
                  refId: A
            for: 0s
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "ArgoCD application-controller restarted"
              description: "All app reconciliation pauses until it recovers. Check: kubectl describe pod -n argocd -l app.kubernetes.io/name=argocd-application-controller"
              runbook: "docs/runbooks/peerisland.md#argocd-controller-oom"
            labels:
              severity: critical
              team: platform
            isPaused: false
