apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-rules
  namespace: monitoring
  labels:
    grafana_alert: "1"   # picked up by Grafana sidecar
data:
  peerisland-alerts.yaml: |
    apiVersion: 1
    groups:
      - name: peerisland-backend
        folder: PeerIsland
        orgId: 1
        interval: 1m
        rules:

          - uid: backend-high-error-rate
            title: BackendHighErrorRate
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 300, to: 0}
                model:
                  expr: |
                    sum(rate(http_requests_total{namespace="peerisland",status_code=~"5.."}[5m]))
                    /
                    sum(rate(http_requests_total{namespace="peerisland"}[5m])) > 0.05
                  instant: true
                  refId: A
            for: 5m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Backend error rate above 5%"
              description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."
              runbook: "docs/runbooks/peerisland.md#backend-high-error-rate"
            labels:
              severity: critical
              team: platform
            isPaused: false

          - uid: backend-high-p99-latency
            title: BackendHighP99Latency
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 600, to: 0}
                model:
                  expr: |
                    histogram_quantile(0.99,
                      sum by(le) (rate(http_request_duration_seconds_bucket{namespace="peerisland"}[5m]))
                    ) > 1
                  instant: true
                  refId: A
            for: 10m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Backend p99 latency above 1 second"
              description: "p99 latency is {{ $value | humanizeDuration }} over the last 10 minutes."
              runbook: "docs/runbooks/peerisland.md#backend-high-latency"
            labels:
              severity: warning
              team: platform
            isPaused: false

          - uid: backend-pod-crash-looping
            title: BackendPodCrashLooping
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 900, to: 0}
                model:
                  expr: |
                    sum by(pod) (
                      increase(kube_pod_container_status_restarts_total{namespace="peerisland",container="backend"}[15m])
                    ) > 3
                  instant: true
                  refId: A
            for: 0s
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Backend pod {{ $labels.pod }} is crash-looping"
              description: "Pod restarted {{ $value | humanize }} times in the last 15 minutes."
              runbook: "docs/runbooks/peerisland.md#crash-looping"
            labels:
              severity: critical
              team: platform
            isPaused: false

          - uid: backend-hpa-at-max
            title: HPAAtMaxReplicas
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 600, to: 0}
                model:
                  expr: |
                    kube_horizontalpodautoscaler_status_current_replicas{namespace="peerisland",horizontalpodautoscaler="backend"}
                    ==
                    kube_horizontalpodautoscaler_spec_max_replicas{namespace="peerisland",horizontalpodautoscaler="backend"}
                  instant: true
                  refId: A
            for: 10m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Backend HPA at maximum replicas"
              description: "HPA has been at maxReplicas ({{ $value }}) for over 10 minutes."
              runbook: "docs/runbooks/peerisland.md#hpa-saturation"
            labels:
              severity: warning
              team: platform
            isPaused: false

          - uid: frontend-high-error-rate
            title: FrontendHighErrorRate
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 300, to: 0}
                model:
                  expr: |
                    sum(rate(http_requests_total{namespace="peerisland",service="frontend",status_code=~"5.."}[5m]))
                    / sum(rate(http_requests_total{namespace="peerisland",service="frontend"}[5m])) > 0.05
                  instant: true
                  refId: A
            for: 5m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Frontend error rate above 5%"
              description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."
              runbook: "docs/runbooks/peerisland.md#frontend-high-error-rate"
            labels:
              severity: critical
              team: platform
            isPaused: false

          - uid: frontend-pod-crash-looping
            title: FrontendPodCrashLooping
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 900, to: 0}
                model:
                  expr: |
                    sum by(pod) (
                      increase(kube_pod_container_status_restarts_total{namespace="peerisland",container="frontend"}[15m])
                    ) > 3
                  instant: true
                  refId: A
            for: 0s
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Frontend pod {{ $labels.pod }} is crash-looping"
              description: "Pod restarted {{ $value | humanize }} times in the last 15 minutes."
              runbook: "docs/runbooks/peerisland.md#crash-looping"
            labels:
              severity: critical
              team: platform
            isPaused: false

          - uid: frontend-hpa-at-max
            title: HPAFrontendAtMaxReplicas
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 600, to: 0}
                model:
                  expr: |
                    kube_horizontalpodautoscaler_status_current_replicas{namespace="peerisland",horizontalpodautoscaler="frontend"}
                    ==
                    kube_horizontalpodautoscaler_spec_max_replicas{namespace="peerisland",horizontalpodautoscaler="frontend"}
                  instant: true
                  refId: A
            for: 10m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Frontend HPA at maximum replicas — capacity pressure"
              description: "Frontend HPA has been at maxReplicas ({{ $value }}) for over 10 minutes."
              runbook: "docs/runbooks/peerisland.md#hpa-saturation"
            labels:
              severity: warning
              team: platform
            isPaused: false

          - uid: pod-oom-killed
            title: PodOOMKilled
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 300, to: 0}
                model:
                  expr: |
                    (increase(kube_pod_container_status_restarts_total{namespace=~"peerisland|monitoring|argocd|ingress-nginx"}[5m]) > 0)
                    and on(namespace, pod, container)
                    (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1)
                  instant: true
                  refId: A
            for: 0s
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Pod {{ $labels.pod }} OOMKilled in {{ $labels.namespace }}"
              description: "Container {{ $labels.container }} was OOMKilled — increase memory limit."
              runbook: "docs/runbooks/peerisland.md#oom-killed"
            labels:
              severity: warning
              team: platform
            isPaused: false

          - uid: pvc-near-full
            title: PVCNearFull
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 600, to: 0}
                model:
                  expr: |
                    kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.85
                  instant: true
                  refId: A
            for: 10m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"
              description: "PVC in namespace {{ $labels.namespace }} will run out of space soon."
              runbook: "docs/runbooks/peerisland.md#pvc-near-full"
            labels:
              severity: warning
              team: platform
            isPaused: false

          - uid: certificate-expiring-soon
            title: CertificateExpiringSoon
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 3600, to: 0}
                model:
                  expr: |
                    certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 24 * 3600
                  instant: true
                  refId: A
            for: 1h
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Certificate {{ $labels.name }} in {{ $labels.namespace }} expires in < 7 days"
              description: "cert-manager should auto-renew — check if renewal is stuck."
              runbook: "docs/runbooks/peerisland.md#certificate-expiry"
            labels:
              severity: critical
              team: platform
            isPaused: false

          - uid: certificate-not-ready
            title: CertificateNotReady
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 600, to: 0}
                model:
                  expr: |
                    certmanager_certificate_ready_status{condition="False"} == 1
                  instant: true
                  refId: A
            for: 10m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Certificate {{ $labels.name }} in {{ $labels.namespace }} is not ready"
              description: "TLS certificate has been not-ready for 10 minutes — HTTPS may be broken."
              runbook: "docs/runbooks/peerisland.md#certificate-expiry"
            labels:
              severity: critical
              team: platform
            isPaused: false

          - uid: argocd-app-unhealthy
            title: ArgoCDAppUnhealthy
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 600, to: 0}
                model:
                  expr: |
                    argocd_app_info{health_status!~"Healthy|Progressing"} == 1
                  instant: true
                  refId: A
            for: 10m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "ArgoCD app {{ $labels.name }} is {{ $labels.health_status }}"
              description: "Check ArgoCD UI at https://peerisland.centralindia.cloudapp.azure.com/argocd"
              runbook: "docs/runbooks/peerisland.md#argocd-app-unhealthy"
            labels:
              severity: warning
              team: platform
            isPaused: false

          # Multiwindow: BOTH long (1h) AND short (5m) windows must exceed the threshold.
          # Long window proves the burn is real; short window proves it is still happening now.
          - uid: slo-high-burn-rate
            title: SLOAvailabilityHighBurnRate
            condition: C
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 3600, to: 0}
                model:
                  expr: "sli:peerisland:error_ratio:rate1h"
                  instant: true
                  refId: A
              - refId: B
                datasourceUid: mimir
                relativeTimeRange: {from: 300, to: 0}
                model:
                  expr: "sli:peerisland:error_ratio:rate5m"
                  instant: true
                  refId: B
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: math
                  expression: "$A > 0.014 && $B > 0.014"
            for: 2m
            noDataState: OK
            execErrState: Error
            annotations:
              summary: "SLO: availability burning budget 14x fast (1h + 5m windows)"
              description: "At this rate, the 30-day error budget will be exhausted in < 2 days. Page immediately."
              runbook: "docs/runbooks/peerisland.md#slo-fast-burn"
            labels:
              severity: critical
              team: platform
              slo: availability
            isPaused: false

          # Multiwindow: BOTH long (6h) AND short (30m) windows must exceed the threshold.
          - uid: slo-medium-burn-rate
            title: SLOAvailabilityMediumBurnRate
            condition: C
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 21600, to: 0}
                model:
                  expr: "sli:peerisland:error_ratio:rate6h"
                  instant: true
                  refId: A
              - refId: B
                datasourceUid: mimir
                relativeTimeRange: {from: 1800, to: 0}
                model:
                  expr: "sli:peerisland:error_ratio:rate30m"
                  instant: true
                  refId: B
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: math
                  expression: "$A > 0.006 && $B > 0.006"
            for: 15m
            noDataState: OK
            execErrState: Error
            annotations:
              summary: "SLO: availability burning budget 6x fast (6h + 30m windows)"
              description: "At this rate, the 30-day error budget will be exhausted in < 5 days. Create a ticket."
              runbook: "docs/runbooks/peerisland.md#slo-slow-burn"
            labels:
              severity: warning
              team: platform
              slo: availability
            isPaused: false

          - uid: backend-no-replicas
            title: BackendNoAvailableReplicas
            condition: C
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 300, to: 0}
                model:
                  expr: 'sum(kube_replicaset_status_ready_replicas{namespace="peerisland",replicaset=~"backend-.*"})'
                  instant: true
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A < 1"}
            for: 1m
            noDataState: Alerting
            execErrState: Error
            annotations:
              summary: "Backend deployment has no available replicas"
              description: "backend has 0 ready pods — service is completely down."
              runbook: "docs/runbooks/peerisland.md#no-replicas"
            labels:
              severity: critical
              team: platform
            isPaused: false

          - uid: frontend-no-replicas
            title: FrontendNoAvailableReplicas
            condition: C
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 300, to: 0}
                model:
                  expr: 'sum(kube_replicaset_status_ready_replicas{namespace="peerisland",replicaset=~"frontend-.*"})'
                  instant: true
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A < 1"}
            for: 1m
            noDataState: Alerting
            execErrState: Error
            annotations:
              summary: "Frontend deployment has no available replicas"
              description: "frontend has 0 ready pods — service is completely down."
              runbook: "docs/runbooks/peerisland.md#no-replicas"
            labels:
              severity: critical
              team: platform
            isPaused: false

          - uid: slo-latency-breach
            title: SLOLatencyBreach
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 600, to: 0}
                model:
                  expr: |
                    histogram_quantile(0.99,
                      sum(rate(http_request_duration_seconds_bucket{namespace="peerisland"}[5m])) by (le)
                    ) > 0.5
                  instant: true
                  refId: A
            for: 10m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "SLO: p99 latency above 500ms for 10 minutes"
              description: "Current p99: {{ $value | humanizeDuration }}"
              runbook: "docs/runbooks/peerisland.md#backend-high-latency"
            labels:
              severity: warning
              team: platform
              slo: latency
            isPaused: false

      - name: peerisland-nodes
        folder: PeerIsland
        orgId: 1
        interval: 1m
        rules:

          - uid: node-not-ready
            title: NodeNotReady
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 300, to: 0}
                model:
                  expr: 'kube_node_status_condition{condition="Ready",status="true"} == 0'
                  instant: true
                  refId: A
            for: 5m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Node {{ $labels.node }} is NotReady"
              description: "Node has been in NotReady state for more than 5 minutes."
              runbook: "docs/runbooks/peerisland.md#node-not-ready"
            labels:
              severity: critical
              team: platform
            isPaused: false

          - uid: node-high-cpu
            title: NodeHighCPU
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 900, to: 0}
                model:
                  expr: '1 - avg by(node) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.85'
                  instant: true
                  refId: A
            for: 15m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Node {{ $labels.node }} CPU above 85%"
              description: "Node CPU usage is {{ $value | humanizePercentage }} for more than 15 minutes."
              runbook: "docs/runbooks/peerisland.md#node-high-cpu"
            labels:
              severity: warning
              team: platform
            isPaused: false

          - uid: node-high-memory
            title: NodeHighMemory
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 600, to: 0}
                model:
                  expr: '1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90'
                  instant: true
                  refId: A
            for: 10m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Node {{ $labels.node }} memory above 90%"
              description: "Node memory usage is {{ $value | humanizePercentage }} for more than 10 minutes — OOM evictions likely."
              runbook: "docs/runbooks/peerisland.md#node-high-memory"
            labels:
              severity: critical
              team: platform
            isPaused: false

          - uid: node-disk-pressure
            title: NodeDiskPressure
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 300, to: 0}
                model:
                  expr: 'kube_node_status_condition{condition="DiskPressure",status="true"} == 1'
                  instant: true
                  refId: A
            for: 2m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Node {{ $labels.node }} is under disk pressure"
              description: "kubelet is evicting pods due to low disk space."
              runbook: "docs/runbooks/peerisland.md#node-disk-pressure"
            labels:
              severity: critical
              team: platform
            isPaused: false

          - uid: node-disk-usage-high
            title: NodeDiskUsageHigh
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 600, to: 0}
                model:
                  expr: '1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) > 0.85'
                  instant: true
                  refId: A
            for: 10m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Node {{ $labels.node }} root filesystem {{ $value | humanizePercentage }} full"
              description: "Disk will fill before disk pressure is triggered — clean logs or expand disk."
              runbook: "docs/runbooks/peerisland.md#node-disk-pressure"
            labels:
              severity: warning
              team: platform
            isPaused: false

      - name: peerisland-pod-scheduling
        folder: PeerIsland
        orgId: 1
        interval: 1m
        rules:

          - uid: pod-stuck-pending
            title: PodStuckPending
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 900, to: 0}
                model:
                  expr: 'kube_pod_status_phase{namespace=~"peerisland|monitoring|argocd|ingress-nginx",phase="Pending"} == 1'
                  instant: true
                  refId: A
            for: 15m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Pod {{ $labels.pod }} in {{ $labels.namespace }} has been Pending for 15 minutes"
              description: "Check events: kubectl describe pod {{ $labels.pod }} -n {{ $labels.namespace }}"
              runbook: "docs/runbooks/peerisland.md#pod-stuck-pending"
            labels:
              severity: warning
              team: platform
            isPaused: false

          - uid: pod-image-pull-backoff
            title: PodImagePullBackOff
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 300, to: 0}
                model:
                  expr: 'kube_pod_container_status_waiting_reason{namespace=~"peerisland|monitoring|argocd|ingress-nginx",reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName"} == 1'
                  instant: true
                  refId: A
            for: 5m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Pod {{ $labels.pod }} container {{ $labels.container }} cannot pull image"
              description: "Image pull failing in {{ $labels.namespace }}. Check image name, tag, and ACR credentials."
              runbook: "docs/runbooks/peerisland.md#image-pull-backoff"
            labels:
              severity: critical
              team: platform
            isPaused: false

          - uid: pod-unschedulable
            title: PodUnschedulable
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 600, to: 0}
                model:
                  expr: 'kube_pod_status_unschedulable{namespace=~"peerisland|monitoring|argocd"} == 1'
                  instant: true
                  refId: A
            for: 10m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is unschedulable"
              description: "No node has sufficient resources. Check node capacity or HPA/resource limits."
              runbook: "docs/runbooks/peerisland.md#pod-stuck-pending"
            labels:
              severity: critical
              team: platform
            isPaused: false

      - name: peerisland-ingress
        folder: PeerIsland
        orgId: 1
        interval: 1m
        rules:

          - uid: ingress-high-error-rate
            title: IngressHighErrorRate
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 300, to: 0}
                model:
                  expr: |
                    sum(rate(nginx_ingress_controller_requests{status=~"5.."}[5m]))
                    /
                    sum(rate(nginx_ingress_controller_requests[5m])) > 0.05
                  instant: true
                  refId: A
            for: 5m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Ingress NGINX 5xx rate above 5%"
              description: "Global ingress error rate is {{ $value | humanizePercentage }}."
              runbook: "docs/runbooks/peerisland.md#ingress-high-error-rate"
            labels:
              severity: critical
              team: platform
            isPaused: false

          - uid: ingress-high-latency
            title: IngressHighLatencyP99
            condition: A
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 600, to: 0}
                model:
                  expr: |
                    histogram_quantile(0.99,
                      sum by(le, ingress) (rate(nginx_ingress_controller_request_duration_seconds_bucket[5m]))
                    ) > 2
                  instant: true
                  refId: A
            for: 10m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Ingress {{ $labels.ingress }} p99 latency above 2 seconds"
              description: "NGINX is spending > 2s on p99 requests — backend or timeout issue."
              runbook: "docs/runbooks/peerisland.md#ingress-high-latency"
            labels:
              severity: warning
              team: platform
            isPaused: false

          - uid: ingress-controller-down
            title: IngressControllerDown
            condition: C
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 300, to: 0}
                model:
                  expr: 'sum(kube_pod_status_phase{namespace="ingress-nginx",phase="Running"})'
                  instant: true
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A < 1"}
            for: 2m
            noDataState: Alerting
            execErrState: Error
            annotations:
              summary: "No ingress-nginx pods running — cluster is unreachable"
              description: "All NGINX pods are down. All HTTP/HTTPS traffic is blocked."
              runbook: "docs/runbooks/peerisland.md#ingress-controller-down"
            labels:
              severity: critical
              team: platform
            isPaused: false

      - name: peerisland-monitoring-stack
        folder: PeerIsland
        orgId: 1
        interval: 1m
        rules:

          - uid: mimir-down
            title: MimirDown
            condition: C
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 300, to: 0}
                model:
                  expr: 'sum(kube_pod_status_phase{namespace="monitoring",pod=~"mimir-.*",phase="Running"})'
                  instant: true
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A < 1"}
            for: 5m
            noDataState: Alerting
            execErrState: Error
            annotations:
              summary: "Mimir has no running pods — metrics storage is down"
              description: "All alerts and dashboards backed by Mimir will stop working."
              runbook: "docs/runbooks/peerisland.md#mimir-down"
            labels:
              severity: critical
              team: platform
            isPaused: false

          - uid: loki-down
            title: LokiDown
            condition: C
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 300, to: 0}
                model:
                  expr: 'sum(kube_pod_status_phase{namespace="monitoring",pod=~"loki-.*",phase="Running"})'
                  instant: true
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A < 1"}
            for: 5m
            noDataState: Alerting
            execErrState: Error
            annotations:
              summary: "Loki has no running pods — log storage is down"
              description: "Log dashboards and log-based alerts will stop working."
              runbook: "docs/runbooks/peerisland.md#loki-down"
            labels:
              severity: critical
              team: platform
            isPaused: false

          - uid: tempo-down
            title: TempoDown
            condition: C
            data:
              - refId: A
                datasourceUid: mimir
                relativeTimeRange: {from: 300, to: 0}
                model:
                  expr: 'sum(kube_pod_status_phase{namespace="monitoring",pod=~"tempo-.*",phase="Running"})'
                  instant: true
                  refId: A
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A < 1"}
            for: 5m
            noDataState: Alerting
            execErrState: Error
            annotations:
