apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-argocd
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: PeerIsland
data:
  argocd-dashboard.json: |
    {
      "title": "ArgoCD GitOps",
      "uid": "peerisland-argocd",
      "description": "ArgoCD application health, sync status, reconciliation latency and repo server performance",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "1m",
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "graphTooltip": 1,
      "tags": ["peerisland", "argocd", "gitops"],
      "annotations": {"list": [{"name": "Alerts", "datasource": {"type": "datasource", "uid": "grafana"}, "enable": true, "iconColor": "red", "target": {"type": "tags", "tags": ["alert"]}}]},
      "links": [{"type": "dashboards", "title": "PeerIsland", "tags": ["peerisland"], "asDropdown": true, "includeVars": true, "keepTime": true}],
      "panels": [
        {"id": 1, "type": "stat", "title": "Healthy Apps", "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "count(argocd_app_info{health_status=\"Healthy\"}) or vector(0)", "legendFormat": "healthy", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}}},
        {"id": 2, "type": "stat", "title": "Synced Apps", "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "count(argocd_app_info{sync_status=\"Synced\"}) or vector(0)", "legendFormat": "synced", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}}},
        {"id": 3, "type": "stat", "title": "Degraded Apps", "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "count(argocd_app_info{health_status!~\"Healthy|Progressing\"}) or vector(0)", "legendFormat": "unhealthy", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 2}]}}}},
        {"id": 6, "type": "stat", "title": "Out of Sync Apps", "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "count(argocd_app_info{sync_status!=\"Synced\"}) or vector(0)", "legendFormat": "out-of-sync", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 2}]}}}},

        {"id": 4, "type": "timeseries", "title": "Sync Activity (per hour)", "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sum by(app) (increase(argocd_app_sync_total[1h]))", "legendFormat": "{{app}}", "refId": "A"}],
