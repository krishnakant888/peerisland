# Dashboard ConfigMaps — loaded automatically by the Grafana sidecar (sidecar.dashboards.enabled=true).
# Label grafana_dashboard="1" triggers the sidecar to pick the ConfigMap up.
# Annotation grafana_folder sets the Grafana folder name.
#
# To add a new dashboard: add a new ConfigMap here following the same pattern.
# The sidecar hot-reloads without a Grafana restart.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-app
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: PeerIsland
data:
  app-dashboard.json: |
    {
      "title": "PeerIsland Application Dashboard",
      "uid": "peerisland-app",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "1m",
      "time": {"from": "now-6h", "to": "now"},
      "tags": ["peerisland", "application"],
      "panels": [
        {"id": 1, "type": "stat", "title": "Total Request Rate", "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sum(rate(http_requests_total{namespace=\"peerisland\"}[5m]))", "legendFormat": "req/s"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "reqps", "thresholds": {"steps": [
            {"color": "green", "value": null}, {"color": "yellow", "value": 50}, {"color": "red", "value": 100}]}}}},
        {"id": 2, "type": "stat", "title": "Error Rate (%)", "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "100 * sum(rate(http_requests_total{namespace=\"peerisland\",status_code=~\"5..\"}[5m])) / sum(rate(http_requests_total{namespace=\"peerisland\"}[5m]))", "legendFormat": "error %"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"steps": [
            {"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 5}]}}}},
        {"id": 3, "type": "stat", "title": "P99 Latency", "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[5m])) by (le))", "legendFormat": "p99"}],
          "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"steps": [
            {"color": "green", "value": null}, {"color": "yellow", "value": 0.5}, {"color": "red", "value": 2}]}}}},
        {"id": 4, "type": "stat", "title": "Running Pods", "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "count(kube_pod_status_phase{namespace=\"peerisland\",phase=\"Running\"})", "legendFormat": "pods"}],
          "fieldConfig": {"defaults": {"thresholds": {"steps": [
            {"color": "red", "value": null}, {"color": "yellow", "value": 2}, {"color": "green", "value": 4}]}}}},
        {"id": 5, "type": "timeseries", "title": "HTTP Request Rate by Status", "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"expr": "sum(rate(http_requests_total{namespace=\"peerisland\",status_code=~\"2..\"}[5m]))", "legendFormat": "2xx"},
            {"expr": "sum(rate(http_requests_total{namespace=\"peerisland\",status_code=~\"4..\"}[5m]))", "legendFormat": "4xx"},
            {"expr": "sum(rate(http_requests_total{namespace=\"peerisland\",status_code=~\"5..\"}[5m]))", "legendFormat": "5xx"}],
          "fieldConfig": {"defaults": {"unit": "reqps"}}},
        {"id": 6, "type": "timeseries", "title": "Latency Percentiles (with Exemplars)", "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[5m])) by (le))", "legendFormat": "p50", "exemplar": true},
            {"expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[5m])) by (le))", "legendFormat": "p95", "exemplar": true},
            {"expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[5m])) by (le))", "legendFormat": "p99", "exemplar": true}],
          "fieldConfig": {"defaults": {"unit": "s"}}},
        {"id": 7, "type": "timeseries", "title": "CPU Usage by Pod", "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"peerisland\",container!=\"\"}[5m])) by (pod)", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "cores"}}},
        {"id": 8, "type": "timeseries", "title": "Memory Usage by Pod", "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sum(container_memory_working_set_bytes{namespace=\"peerisland\",container!=\"\"}) by (pod)", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}}},
        {"id": 9, "type": "timeseries", "title": "Pod Restarts", "gridPos": {"x": 0, "y": 20, "w": 12, "h": 6},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "increase(kube_pod_container_status_restarts_total{namespace=\"peerisland\"}[1h])", "legendFormat": "{{pod}}/{{container}}"}],
          "fieldConfig": {"defaults": {"unit": "short"}}},
        {"id": 10, "type": "timeseries", "title": "Network I/O", "gridPos": {"x": 12, "y": 20, "w": 12, "h": 6},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"expr": "sum(rate(container_network_receive_bytes_total{namespace=\"peerisland\"}[5m]))", "legendFormat": "rx"},
            {"expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"peerisland\"}[5m]))", "legendFormat": "tx"}],
          "fieldConfig": {"defaults": {"unit": "Bps"}}},
        {"id": 11, "type": "traces", "title": "Recent Traces (slow requests > 200ms)", "gridPos": {"x": 0, "y": 26, "w": 24, "h": 10},
          "datasource": {"type": "tempo", "uid": "tempo"},
          "targets": [{"datasource": {"type": "tempo", "uid": "tempo"}, "queryType": "traceql",
            "query": "{ .service.name = \"peerisland-backend\" && .http.target != \"/health\" } | duration > 200ms", "limit": 20}]}
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-apm
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: PeerIsland
data:
  apm-dashboard.json: |
    {
      "title": "PeerIsland APM",
      "uid": "peerisland-apm",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "1m",
      "time": {"from": "now-1h", "to": "now"},
      "tags": ["peerisland", "apm", "traces"],
      "panels": [
        {"id": 1, "type": "stat", "title": "Request Rate (RPS)", "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sum(rate(http_requests_total{namespace=\"peerisland\"}[5m]))", "legendFormat": "req/s"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "reqps"}}},
        {"id": 2, "type": "stat", "title": "Error Rate (%)", "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "100 * sum(rate(http_requests_total{namespace=\"peerisland\",status_code=~\"5..\"}[5m])) / sum(rate(http_requests_total{namespace=\"peerisland\"}[5m]))", "legendFormat": "error %"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "percent"}}},
        {"id": 3, "type": "stat", "title": "P99 Latency", "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "histogram_quantile(0.99, sum by(le) (rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[5m])))", "legendFormat": "p99"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "s"}}},
        {"id": 5, "type": "timeseries", "title": "Latency Percentiles Over Time", "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"expr": "histogram_quantile(0.99, sum by(le) (rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[5m])))", "legendFormat": "p99"},
            {"expr": "histogram_quantile(0.95, sum by(le) (rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[5m])))", "legendFormat": "p95"},
            {"expr": "histogram_quantile(0.50, sum by(le) (rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[5m])))", "legendFormat": "p50"}],
          "fieldConfig": {"defaults": {"unit": "s"}}},
        {"id": 7, "type": "traces", "title": "Recent Traces (slow requests > 200ms)", "gridPos": {"x": 0, "y": 12, "w": 24, "h": 10},
          "datasource": {"type": "tempo", "uid": "tempo"},
          "targets": [{"datasource": {"type": "tempo", "uid": "tempo"}, "queryType": "traceql",
            "query": "{ .http.target != \"/health\" } | duration > 200ms", "limit": 20}]}
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-infrastructure
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: PeerIsland
data:
  infrastructure-dashboard.json: |
    {
      "title": "PeerIsland Infrastructure",
      "uid": "peerisland-infra",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "2m",
      "time": {"from": "now-3h", "to": "now"},
      "tags": ["peerisland", "infrastructure", "k8s"],
      "panels": [
        {"id": 1, "type": "timeseries", "title": "Node CPU Usage", "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "1 - avg by(node) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))", "legendFormat": "{{node}}"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "max": 1, "min": 0}}},
        {"id": 2, "type": "timeseries", "title": "Node Memory Usage", "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)", "legendFormat": "{{node}}"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "max": 1, "min": 0}}},
        {"id": 3, "type": "table", "title": "Pod Restart Count (last 1h)", "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "topk(10, increase(kube_pod_container_status_restarts_total{namespace=\"peerisland\"}[1h]))", "legendFormat": "{{pod}}/{{container}}", "instant": true}],
          "options": {"sortBy": [{"displayName": "Value", "desc": true}]},
          "fieldConfig": {"defaults": {"unit": "short"}}},
        {"id": 4, "type": "timeseries", "title": "HPA Replicas (backend)", "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"peerisland\",horizontalpodautoscaler=\"backend\"}", "legendFormat": "current"},
            {"expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"peerisland\",horizontalpodautoscaler=\"backend\"}", "legendFormat": "desired"},
            {"expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"peerisland\",horizontalpodautoscaler=\"backend\"}", "legendFormat": "max"}],
          "fieldConfig": {"defaults": {"unit": "short", "min": 0}}},
        {"id": 5, "type": "timeseries", "title": "Container CPU Usage by Pod", "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sum by(pod, container) (rate(container_cpu_usage_seconds_total{namespace=\"peerisland\",container!=\"\"}[5m]))", "legendFormat": "{{pod}}/{{container}}"}],
          "fieldConfig": {"defaults": {"unit": "cores"}}},
        {"id": 6, "type": "timeseries", "title": "Container Memory Usage by Pod", "gridPos": {"x": 12, "y": 16, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sum by(pod, container) (container_memory_working_set_bytes{namespace=\"peerisland\",container!=\"\"})", "legendFormat": "{{pod}}/{{container}}"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}}}
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-slo
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: PeerIsland
data:
  slo-dashboard.json: |
    {
      "title": "PeerIsland SLO",
      "uid": "peerisland-slo",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "5m",
      "time": {"from": "now-30d", "to": "now"},
      "tags": ["peerisland", "slo"],
      "panels": [
        {"id": 1, "type": "gauge", "title": "Availability SLO (target: 99.9%)", "gridPos": {"x": 0, "y": 0, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "100 * (1 - sli:peerisland:error_ratio:rate30d)", "legendFormat": "availability %"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"unit": "percent", "min": 99, "max": 100,
            "thresholds": {"steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 99.5}, {"color": "green", "value": 99.9}]}}}},
        {"id": 2, "type": "gauge", "title": "Error Budget Remaining (30d)", "gridPos": {"x": 8, "y": 0, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "100 * clamp_min(slo:peerisland:error_budget_remaining, 0)", "legendFormat": "budget %"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100,
            "thresholds": {"steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 25}, {"color": "green", "value": 50}]}}}},
        {"id": 3, "type": "stat", "title": "Current SLI Error Ratio (1h)", "gridPos": {"x": 16, "y": 0, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sli:peerisland:error_ratio:rate1h", "legendFormat": "error ratio"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.001}, {"color": "red", "value": 0.014}]}}}},
        {"id": 4, "type": "timeseries", "title": "SLO Burn Rate (fast: 1h, slow: 6h)", "gridPos": {"x": 0, "y": 8, "w": 24, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"expr": "sli:peerisland:error_ratio:rate1h / 0.001", "legendFormat": "burn rate 1h"},
            {"expr": "sli:peerisland:error_ratio:rate6h / 0.001", "legendFormat": "burn rate 6h"},
            {"expr": "vector(14)", "legendFormat": "fast-burn threshold (page)"},
            {"expr": "vector(6)", "legendFormat": "slow-burn threshold (ticket)"}],
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"lineWidth": 2}},
            "overrides": [
              {"matcher": {"id": "byName", "options": "burn rate 1h"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]},
              {"matcher": {"id": "byName", "options": "burn rate 6h"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "orange"}}]},
              {"matcher": {"id": "byName", "options": "fast-burn threshold (page)"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-red"}}, {"id": "custom.lineStyle", "value": {"dash": [10, 10], "fill": "dash"}}]},
              {"matcher": {"id": "byName", "options": "slow-burn threshold (ticket)"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-orange"}}, {"id": "custom.lineStyle", "value": {"dash": [10, 10], "fill": "dash"}}]}]}},
        {"id": 5, "type": "timeseries", "title": "SLI Error Ratio Over Time (multi-window)", "gridPos": {"x": 0, "y": 16, "w": 24, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"expr": "sli:peerisland:error_ratio:rate5m", "legendFormat": "5m"},
            {"expr": "sli:peerisland:error_ratio:rate1h", "legendFormat": "1h"},
            {"expr": "sli:peerisland:error_ratio:rate6h", "legendFormat": "6h"},
            {"expr": "vector(0.001)", "legendFormat": "SLO budget (0.1%)"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0,
            "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.001}, {"color": "red", "value": 0.014}]},
            "custom": {"thresholdsStyle": {"mode": "area"}}}}},
        {"id": 6, "type": "timeseries", "title": "p99 Latency vs 500ms SLO", "gridPos": {"x": 0, "y": 24, "w": 24, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[5m])) by (le)) * 1000", "legendFormat": "p99 (ms)"}],
          "fieldConfig": {"defaults": {"unit": "ms",
            "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 300}, {"color": "red", "value": 500}]},
            "custom": {"thresholdsStyle": {"mode": "line"}}}}}
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-rollouts
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: PeerIsland
data:
  rollout-dashboard.json: |
    {
      "title": "PeerIsland Rollouts",
      "uid": "peerisland-rollouts",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-2h", "to": "now"},
      "tags": ["peerisland", "rollouts", "deployments"],
      "panels": [
        {"id": 1, "type": "stat", "title": "Frontend — Active Ready Pods", "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sum(kube_replicaset_status_ready_replicas{namespace=\"peerisland\",replicaset=~\"frontend.*\"})", "legendFormat": "ready"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 1}, {"color": "green", "value": 2}]}}}},
        {"id": 2, "type": "stat", "title": "Backend — Active Ready Pods", "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sum(kube_replicaset_status_ready_replicas{namespace=\"peerisland\",replicaset=~\"backend.*\"})", "legendFormat": "ready"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 1}, {"color": "green", "value": 2}]}}}},
        {"id": 3, "type": "stat", "title": "Error Rate (2m — canary window)", "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "100 * sum(rate(http_requests_total{namespace=\"peerisland\",status_code=~\"5..\"}[2m])) / sum(rate(http_requests_total{namespace=\"peerisland\"}[2m]))", "legendFormat": "error %"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 5}]}}}},
        {"id": 4, "type": "stat", "title": "P99 Latency (2m — canary window)", "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "histogram_quantile(0.99, sum by(le) (rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[2m])))", "legendFormat": "p99"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.5}, {"color": "red", "value": 1}]}}}},
        {"id": 5, "type": "timeseries", "title": "ReplicaSet Ready Pods Over Time", "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "kube_replicaset_status_ready_replicas{namespace=\"peerisland\"}", "legendFormat": "{{replicaset}}"}],
          "fieldConfig": {"defaults": {"unit": "short", "min": 0}}},
        {"id": 6, "type": "timeseries", "title": "Error Rate During Rollout", "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "100 * sum(rate(http_requests_total{namespace=\"peerisland\",status_code=~\"5..\"}[2m])) / sum(rate(http_requests_total{namespace=\"peerisland\"}[2m]))", "legendFormat": "error %"}],
          "fieldConfig": {"defaults": {"unit": "percent",
            "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 5}]},
            "custom": {"thresholdsStyle": {"mode": "line"}}}}},
        {"id": 7, "type": "timeseries", "title": "Pod Restarts (1h)", "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "increase(kube_pod_container_status_restarts_total{namespace=\"peerisland\"}[1h])", "legendFormat": "{{pod}}/{{container}}"}],
          "fieldConfig": {"defaults": {"unit": "short"}}},
        {"id": 8, "type": "traces", "title": "Error Traces During Rollout", "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8},
          "datasource": {"type": "tempo", "uid": "tempo"},
          "targets": [{"datasource": {"type": "tempo", "uid": "tempo"}, "queryType": "traceql",
            "query": "{ status = error && .service.name = \"peerisland-backend\" }", "limit": 10}]}
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: PeerIsland
data:
  logs-dashboard.json: |
    {
      "title": "PeerIsland Logs",
      "uid": "peerisland-logs",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "tags": ["peerisland", "logs", "loki"],
      "panels": [
        {"id": 1, "type": "stat", "title": "Error Log Rate (last 5m)", "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "sum(rate({namespace=\"peerisland\", level=\"error\"}[5m]))", "legendFormat": "errors/s"}],
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 10}]}}}},
        {"id": 2, "type": "stat", "title": "Warn Log Rate (last 5m)", "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "sum(rate({namespace=\"peerisland\", level=\"warn\"}[5m]))", "legendFormat": "warns/s"}],
          "fieldConfig": {"defaults": {"unit": "short"}}},
        {"id": 3, "type": "timeseries", "title": "Log Volume by Level", "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [
            {"expr": "sum(rate({namespace=\"peerisland\", level=\"error\"}[5m]))", "legendFormat": "error"},
            {"expr": "sum(rate({namespace=\"peerisland\", level=\"warn\"}[5m]))", "legendFormat": "warn"},
            {"expr": "sum(rate({namespace=\"peerisland\", level=\"info\"}[5m]))", "legendFormat": "info"},
            {"expr": "sum(rate({namespace=\"peerisland\"}[5m]))", "legendFormat": "all"}],
          "fieldConfig": {"defaults": {"unit": "short"}}},
        {"id": 4, "type": "timeseries", "title": "Log Rate by Container", "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "sum by(container) (rate({namespace=\"peerisland\"}[5m]))", "legendFormat": "{{container}}"}],
          "fieldConfig": {"defaults": {"unit": "short"}}},
        {"id": 5, "type": "logs", "title": "Backend Error Logs", "gridPos": {"x": 0, "y": 12, "w": 24, "h": 10},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{namespace=\"peerisland\", service=\"backend\", level=\"error\"}", "legendFormat": ""}],
          "options": {"dedupStrategy": "none", "showLabels": false, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true}},
        {"id": 6, "type": "logs", "title": "All Application Logs", "gridPos": {"x": 0, "y": 22, "w": 24, "h": 10},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{namespace=\"peerisland\"}", "legendFormat": ""}],
          "options": {"dedupStrategy": "none", "showLabels": true, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true}}
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-argocd
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: PeerIsland
data:
  argocd-dashboard.json: |
    {
      "title": "ArgoCD GitOps",
      "uid": "peerisland-argocd",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "1m",
      "time": {"from": "now-6h", "to": "now"},
      "tags": ["peerisland", "argocd", "gitops"],
      "panels": [
        {"id": 1, "type": "stat", "title": "Healthy Apps", "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "count(argocd_app_info{health_status=\"Healthy\"})", "legendFormat": "healthy"}],
          "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}}},
        {"id": 2, "type": "stat", "title": "Synced Apps", "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "count(argocd_app_info{sync_status=\"Synced\"})", "legendFormat": "synced"}],
          "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}}},
        {"id": 3, "type": "stat", "title": "Degraded Apps", "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "count(argocd_app_info{health_status!~\"Healthy|Progressing\"}) or vector(0)", "legendFormat": "unhealthy"}],
          "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 2}]}}}},
        {"id": 4, "type": "timeseries", "title": "Sync Activity (per hour)", "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sum by(app) (increase(argocd_app_sync_total[1h]))", "legendFormat": "{{app}}"}],
          "fieldConfig": {"defaults": {"unit": "short"}}},
        {"id": 5, "type": "timeseries", "title": "Reconciliation Duration p99", "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "histogram_quantile(0.99, sum by(le) (rate(argocd_app_reconcile_bucket[5m])))", "legendFormat": "p99"}],
          "fieldConfig": {"defaults": {"unit": "s"}}}
      ]
    }
