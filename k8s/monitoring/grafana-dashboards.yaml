# Dashboard ConfigMaps — loaded automatically by the Grafana sidecar (sidecar.dashboards.enabled=true).
# Label grafana_dashboard="1" triggers the sidecar to pick the ConfigMap up.
# Annotation grafana_folder sets the Grafana folder name.
#
# To add a new dashboard: add a new ConfigMap here following the same pattern.
# The sidecar hot-reloads without a Grafana restart.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-app
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: PeerIsland
data:
  app-dashboard.json: |
    {
      "title": "PeerIsland Application Dashboard",
      "uid": "peerisland-app",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "graphTooltip": 1,
      "tags": ["peerisland", "application"],
      "annotations": {"list": [{"name": "Alerts", "datasource": {"type": "datasource", "uid": "grafana"}, "enable": true, "iconColor": "red", "target": {"type": "tags", "tags": ["alert"]}}]},
      "links": [{"type": "dashboards", "title": "PeerIsland", "tags": ["peerisland"], "asDropdown": true, "includeVars": true, "keepTime": true}],
      "panels": [
        {"id": 1, "type": "stat", "title": "Request Rate", "gridPos": {"x": 0, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sum(rate(http_requests_total{namespace=\"peerisland\"}[5m])) or vector(0)", "legendFormat": "req/s", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "area"},
          "fieldConfig": {"defaults": {"unit": "reqps", "thresholds": {"mode": "absolute", "steps": [
            {"color": "green", "value": null}, {"color": "yellow", "value": 50}, {"color": "red", "value": 100}]}}}},
        {"id": 2, "type": "stat", "title": "SLI 5m", "gridPos": {"x": 4, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "1 - sli:peerisland:error_ratio:rate5m", "legendFormat": "SLI", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "decimals": 4, "min": 0, "max": 1,
            "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 0.99}, {"color": "green", "value": 0.999}]}}}},
        {"id": 3, "type": "stat", "title": "P99 Latency", "gridPos": {"x": 8, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[5m])) by (le))", "legendFormat": "p99", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"mode": "absolute", "steps": [
            {"color": "green", "value": null}, {"color": "yellow", "value": 0.3}, {"color": "red", "value": 0.5}]}}}},
        {"id": 18, "type": "stat", "title": "Error Rate %", "gridPos": {"x": 12, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "100 * sum(rate(http_requests_total{namespace=\"peerisland\",status_code=~\"5..\"}[5m])) / sum(rate(http_requests_total{namespace=\"peerisland\"}[5m]))", "legendFormat": "error %", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"mode": "absolute", "steps": [
            {"color": "green", "value": null}, {"color": "yellow", "value": 0.5}, {"color": "red", "value": 1}]}}}},
        {"id": 4, "type": "stat", "title": "Running Pods", "gridPos": {"x": 16, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "count(kube_pod_status_phase{namespace=\"peerisland\",phase=\"Running\"}) or vector(0)", "legendFormat": "pods", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [
            {"color": "red", "value": null}, {"color": "yellow", "value": 2}, {"color": "green", "value": 4}]}}}},
        {"id": 19, "type": "stat", "title": "Error Logs (5m)", "gridPos": {"x": 20, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "sum(count_over_time({namespace=\"peerisland\", level=~\"(?i)error|fatal\"}[5m])) or vector(0)", "legendFormat": "", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "thresholds": {"mode": "absolute", "steps": [
            {"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 20}]}}}},

        {"id": 100, "type": "row", "title": "Traffic", "collapsed": false, "gridPos": {"x": 0, "y": 4, "w": 24, "h": 1}},

        {"id": 5, "type": "timeseries", "title": "HTTP Request Rate by Status", "gridPos": {"x": 0, "y": 5, "w": 12, "h": 7},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"expr": "sum(rate(http_requests_total{namespace=\"peerisland\",status_code=~\"2..\"}[5m]))", "legendFormat": "2xx", "refId": "A"},
            {"expr": "sum(rate(http_requests_total{namespace=\"peerisland\",status_code=~\"4..\"}[5m]))", "legendFormat": "4xx", "refId": "B"},
            {"expr": "sum(rate(http_requests_total{namespace=\"peerisland\",status_code=~\"5..\"}[5m]))", "legendFormat": "5xx", "refId": "C"}],
          "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true, "stacking": {"mode": "normal"}}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},
        {"id": 6, "type": "timeseries", "title": "Latency Percentiles (with Exemplars)", "gridPos": {"x": 12, "y": 5, "w": 12, "h": 7},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[5m])) by (le))", "legendFormat": "p50", "refId": "A", "exemplar": true},
            {"expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[5m])) by (le))", "legendFormat": "p95", "refId": "B", "exemplar": true},
            {"expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[5m])) by (le))", "legendFormat": "p99", "refId": "C", "exemplar": true},
            {"expr": "vector(0.5)", "legendFormat": "SLO (500ms)", "refId": "D"}],
          "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}},
            "overrides": [{"matcher": {"id": "byName", "options": "SLO (500ms)"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-red"}}, {"id": "custom.lineStyle", "value": {"dash": [10, 10], "fill": "dash"}}]}]},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}},

        {"id": 20, "type": "timeseries", "title": "Latency p95 by Route", "gridPos": {"x": 0, "y": 12, "w": 12, "h": 7},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "histogram_quantile(0.95, sum by(le, route) (rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[5m])))", "legendFormat": "{{route}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}},
        {"id": 13, "type": "timeseries", "title": "Errors / s by Route", "gridPos": {"x": 12, "y": 12, "w": 12, "h": 7},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sum by(route) (rate(http_requests_total{namespace=\"peerisland\",status_code=~\"5..\"}[5m]))", "legendFormat": "{{route}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}},

        {"id": 101, "type": "row", "title": "Resources", "collapsed": false, "gridPos": {"x": 0, "y": 19, "w": 24, "h": 1}},

        {"id": 7, "type": "timeseries", "title": "CPU Usage by Pod", "gridPos": {"x": 0, "y": 20, "w": 8, "h": 7},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"expr": "sum by(pod) (rate(container_cpu_usage_seconds_total{namespace=\"peerisland\",container!=\"\"}[5m]))", "legendFormat": "{{pod}}", "refId": "A"},
            {"expr": "sum(kube_pod_container_resource_requests{namespace=\"peerisland\",resource=\"cpu\",container!=\"\"})", "legendFormat": "requests (total)", "refId": "B"}],
          "fieldConfig": {"defaults": {"unit": "cores", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},
        {"id": 8, "type": "timeseries", "title": "Memory Working Set vs Limit", "gridPos": {"x": 8, "y": 20, "w": 8, "h": 7},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"expr": "sum by(pod) (container_memory_working_set_bytes{namespace=\"peerisland\",container!=\"\"})", "legendFormat": "{{pod}}", "refId": "A"},
            {"expr": "sum(kube_pod_container_resource_limits{namespace=\"peerisland\",resource=\"memory\",container!=\"\"})", "legendFormat": "limits (total)", "refId": "B"}],
          "fieldConfig": {"defaults": {"unit": "bytes", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},
        {"id": 9, "type": "timeseries", "title": "CPU Throttling", "gridPos": {"x": 16, "y": 20, "w": 8, "h": 7},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sum by(pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"peerisland\",container!=\"\"}[5m])) / sum by(pod) (rate(container_cpu_cfs_periods_total{namespace=\"peerisland\",container!=\"\"}[5m]))", "legendFormat": "{{pod}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "max": 1, "min": 0, "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},

        {"id": 102, "type": "row", "title": "Scaling & Network", "collapsed": false, "gridPos": {"x": 0, "y": 27, "w": 24, "h": 1}},

        {"id": 10, "type": "timeseries", "title": "Pod Restarts", "gridPos": {"x": 0, "y": 28, "w": 8, "h": 7},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sum by(pod) (increase(kube_pod_container_status_restarts_total{namespace=\"peerisland\"}[5m]))", "legendFormat": "{{pod}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},
        {"id": 11, "type": "timeseries", "title": "Network I/O", "gridPos": {"x": 8, "y": 28, "w": 8, "h": 7},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"expr": "sum(rate(container_network_receive_bytes_total{namespace=\"peerisland\"}[5m]))", "legendFormat": "receive", "refId": "A"},
            {"expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"peerisland\"}[5m]))", "legendFormat": "transmit", "refId": "B"}],
          "fieldConfig": {"defaults": {"unit": "Bps", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},
        {"id": 21, "type": "timeseries", "title": "HPA Replicas (backend + frontend)", "gridPos": {"x": 16, "y": 28, "w": 8, "h": 7},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"refId": "A", "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"peerisland\",horizontalpodautoscaler=\"backend\"}", "legendFormat": "backend current"},
            {"refId": "B", "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"peerisland\",horizontalpodautoscaler=\"frontend\"}", "legendFormat": "frontend current"},
            {"refId": "C", "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"peerisland\",horizontalpodautoscaler=\"backend\"}", "legendFormat": "backend max"},
            {"refId": "D", "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"peerisland\",horizontalpodautoscaler=\"frontend\"}", "legendFormat": "frontend max"}],
          "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},

        {"id": 22, "type": "table", "title": "Top Restart Offenders", "gridPos": {"x": 0, "y": 35, "w": 12, "h": 7},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"refId": "A", "expr": "topk(10, sum by(pod, container) (kube_pod_container_status_restarts_total{namespace=\"peerisland\"}))", "instant": true, "format": "table"}],
          "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}, "renameByName": {"Value": "Restarts", "pod": "Pod", "container": "Container"}}}],
          "fieldConfig": {"defaults": {"custom": {"align": "auto"}},
            "overrides": [{"matcher": {"id": "byName", "options": "Restarts"}, "properties": [
              {"id": "thresholds", "value": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 3}, {"color": "red", "value": 10}]}},
              {"id": "custom.cellOptions", "value": {"type": "color-background"}}]}]},
          "options": {"showHeader": true, "cellHeight": "sm", "sortBy": [{"displayName": "Restarts", "desc": true}]}},
        {"id": 14, "type": "timeseries", "title": "Error Log Rate by Pod", "gridPos": {"x": 12, "y": 35, "w": 12, "h": 7},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "sum by(pod) (rate({namespace=\"peerisland\", level=~\"(?i)error|fatal\"}[1m]))", "legendFormat": "{{pod}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},

        {"id": 103, "type": "row", "title": "Logs & Traces", "collapsed": false, "gridPos": {"x": 0, "y": 42, "w": 24, "h": 1}},

        {"id": 15, "type": "traces", "title": "Slowest Recent Traces", "gridPos": {"x": 0, "y": 43, "w": 24, "h": 9},
          "datasource": {"type": "tempo", "uid": "tempo"},
          "targets": [{"datasource": {"type": "tempo", "uid": "tempo"}, "queryType": "traceql",
            "query": "{ resource.service.name =~ \"peerisland.*\" } | select(duration)", "limit": 20, "refId": "A"}]},

        {"id": 16, "type": "logs", "title": "Warnings and Errors", "gridPos": {"x": 0, "y": 52, "w": 24, "h": 9},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{namespace=\"peerisland\", level=~\"(?i)warn|error|fatal\"}", "refId": "A", "queryType": "range"}],
          "options": {"showTime": true, "wrapLogMessage": true, "enableLogDetails": true, "prettifyLogMessage": false, "sortOrder": "Descending", "dedupStrategy": "none"}},
        {"id": 17, "type": "logs", "title": "Kubernetes Events", "gridPos": {"x": 0, "y": 61, "w": 24, "h": 7},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{service=\"kubernetes-events\"} |~ \"peerisland\"", "refId": "A", "queryType": "range"}],
          "options": {"showTime": true, "wrapLogMessage": true, "enableLogDetails": true, "sortOrder": "Descending", "dedupStrategy": "none"}}
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-apm
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: PeerIsland
data:
  apm-dashboard.json: |
    {
      "title": "PeerIsland APM",
      "uid": "peerisland-apm",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "15s",
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "graphTooltip": 1,
      "tags": ["peerisland", "apm", "traces"],
      "annotations": {"list": [{"name": "Alerts", "datasource": {"type": "datasource", "uid": "grafana"}, "enable": true, "iconColor": "red", "target": {"type": "tags", "tags": ["alert"]}}]},
      "links": [{"type": "dashboards", "title": "PeerIsland", "tags": ["peerisland"], "asDropdown": true, "includeVars": true, "keepTime": true}],
      "panels": [
        {"id": 1, "type": "stat", "title": "SLI 5m", "gridPos": {"x": 0, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "1 - sli:peerisland:error_ratio:rate5m", "legendFormat": "SLI", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "decimals": 4, "min": 0, "max": 1,
            "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 0.99}, {"color": "green", "value": 0.999}]}}}},
        {"id": 2, "type": "gauge", "title": "Error Budget (30d)", "gridPos": {"x": 4, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "clamp_min(slo:peerisland:error_budget_remaining, 0)", "legendFormat": "", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1,
            "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 0.25}, {"color": "green", "value": 0.5}]}}}},
        {"id": 3, "type": "stat", "title": "Burn Rate 1h", "gridPos": {"x": 8, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sli:peerisland:error_ratio:rate1h / 0.001", "legendFormat": "", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"decimals": 1, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 6}, {"color": "red", "value": 14}]}}}},
        {"id": 12, "type": "stat", "title": "Burn Rate 6h", "gridPos": {"x": 12, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sli:peerisland:error_ratio:rate6h / 0.001", "legendFormat": "", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"decimals": 1, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 3}, {"color": "red", "value": 6}]}}}},
        {"id": 4, "type": "stat", "title": "Requests / s", "gridPos": {"x": 16, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sli:peerisland:requests_total:rate5m or sum(rate(http_requests_total{namespace=\"peerisland\"}[5m]))", "legendFormat": "", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "reqps", "decimals": 1}}},
        {"id": 5, "type": "stat", "title": "P99 Latency", "gridPos": {"x": 20, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "histogram_quantile(0.99, sum by(le) (rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[5m])))", "legendFormat": "p99", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.3}, {"color": "red", "value": 0.5}]}}}},

        {"id": 100, "type": "row", "title": "Error Ratio & Burn Rate", "collapsed": false, "gridPos": {"x": 0, "y": 4, "w": 24, "h": 1}},

        {"id": 6, "type": "timeseries", "title": "Error Ratio vs SLO Budget", "gridPos": {"x": 0, "y": 5, "w": 12, "h": 7},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"expr": "sli:peerisland:error_ratio:rate5m", "legendFormat": "5m", "refId": "A"},
            {"expr": "sli:peerisland:error_ratio:rate1h", "legendFormat": "1h", "refId": "B"},
            {"expr": "vector(0.001)", "legendFormat": "budget (0.1%)", "refId": "C"},
            {"expr": "vector(14 * 0.001)", "legendFormat": "fast-burn threshold", "refId": "D"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}},
            "overrides": [
              {"matcher": {"id": "byName", "options": "budget (0.1%)"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-red"}}, {"id": "custom.lineStyle", "value": {"dash": [10, 10], "fill": "dash"}}]},
              {"matcher": {"id": "byName", "options": "fast-burn threshold"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}, {"id": "custom.lineStyle", "value": {"dash": [5, 5], "fill": "dash"}}]}]},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},
        {"id": 7, "type": "timeseries", "title": "Latency Percentiles", "gridPos": {"x": 12, "y": 5, "w": 12, "h": 7},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"expr": "histogram_quantile(0.50, sum by(le) (rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[2m])))", "legendFormat": "p50", "refId": "A"},
            {"expr": "histogram_quantile(0.95, sum by(le) (rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[2m])))", "legendFormat": "p95", "refId": "B"},
            {"expr": "histogram_quantile(0.99, sum by(le) (rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[2m])))", "legendFormat": "p99", "refId": "C", "exemplar": true},
            {"expr": "vector(0.5)", "legendFormat": "SLO (500ms)", "refId": "D"}],
          "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}},
            "overrides": [{"matcher": {"id": "byName", "options": "SLO (500ms)"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-red"}}, {"id": "custom.lineStyle", "value": {"dash": [10, 10], "fill": "dash"}}]}]},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}},

        {"id": 101, "type": "row", "title": "Per-Route Breakdown", "collapsed": false, "gridPos": {"x": 0, "y": 12, "w": 24, "h": 1}},

        {"id": 8, "type": "timeseries", "title": "Requests / s by Status Code", "gridPos": {"x": 0, "y": 13, "w": 8, "h": 7},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sum by(status_code) (rate(http_requests_total{namespace=\"peerisland\"}[2m]))", "legendFormat": "{{status_code}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true, "stacking": {"mode": "normal"}}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},
        {"id": 9, "type": "timeseries", "title": "Latency p95 by Route", "gridPos": {"x": 8, "y": 13, "w": 8, "h": 7},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "histogram_quantile(0.95, sum by(le, route) (rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[2m])))", "legendFormat": "{{route}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}},
        {"id": 10, "type": "timeseries", "title": "Errors / s by Route", "gridPos": {"x": 16, "y": 13, "w": 8, "h": 7},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sum by(route) (rate(http_requests_total{namespace=\"peerisland\",status_code=~\"5..\"}[2m]))", "legendFormat": "{{route}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}},

        {"id": 102, "type": "row", "title": "Traces", "collapsed": false, "gridPos": {"x": 0, "y": 20, "w": 24, "h": 1}},

        {"id": 11, "type": "traces", "title": "Slowest Recent Traces", "gridPos": {"x": 0, "y": 21, "w": 24, "h": 9},
          "datasource": {"type": "tempo", "uid": "tempo"},
          "targets": [{"datasource": {"type": "tempo", "uid": "tempo"}, "queryType": "traceql",
            "query": "{ resource.service.name =~ \"peerisland.*\" } | select(duration)", "limit": 20, "refId": "A"}]},
        {"id": 13, "type": "traces", "title": "Error Traces", "gridPos": {"x": 0, "y": 30, "w": 24, "h": 7},
          "datasource": {"type": "tempo", "uid": "tempo"},
          "targets": [{"datasource": {"type": "tempo", "uid": "tempo"}, "queryType": "traceql",
            "query": "{ status = error && resource.service.name =~ \"peerisland.*\" }", "limit": 15, "refId": "A"}]}
      ]
    }
