apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-slo
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: PeerIsland
data:
  slo-dashboard.json: |
    {
      "title": "PeerIsland SLO",
      "uid": "peerisland-slo",
      "description": "30d SLO availability, error budget burn rate (multiwindow), and composite SLI (5xx + latency > 500ms). SLO target: 99.9%.",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "5m",
      "time": {"from": "now-30d", "to": "now"},
      "timezone": "browser",
      "graphTooltip": 1,
      "tags": ["peerisland", "slo"],
      "annotations": {"list": [{"name": "Alerts", "datasource": {"type": "datasource", "uid": "grafana"}, "enable": true, "iconColor": "red", "target": {"type": "tags", "tags": ["alert"]}}]},
      "links": [{"type": "dashboards", "title": "PeerIsland", "tags": ["peerisland"], "asDropdown": true, "includeVars": true, "keepTime": true}],
      "panels": [
        {"id": 1, "type": "gauge", "title": "30d Availability SLO (target: 99.9%)", "gridPos": {"x": 0, "y": 0, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "100 * (1 - sli:peerisland:error_ratio:rate30d)", "legendFormat": "availability %", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"unit": "percent", "min": 99, "max": 100,
            "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 99.5}, {"color": "green", "value": 99.9}]}}}},
        {"id": 2, "type": "gauge", "title": "Error Budget Remaining (30d)", "gridPos": {"x": 8, "y": 0, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "100 * clamp_min(slo:peerisland:error_budget_remaining, 0)", "legendFormat": "budget %", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100,
            "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 25}, {"color": "green", "value": 50}]}}}},
        {"id": 3, "type": "stat", "title": "Current SLI Error Ratio (1h)", "gridPos": {"x": 16, "y": 0, "w": 8, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sli:peerisland:error_ratio:rate1h", "legendFormat": "error ratio", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "percentunit",
            "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.001}, {"color": "red", "value": 0.014}]}}}},
        {"id": 7, "type": "stat", "title": "Burn Rate (1h)", "gridPos": {"x": 16, "y": 4, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sli:peerisland:error_ratio:rate1h / 0.001", "legendFormat": "", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"decimals": 1,
            "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 6}, {"color": "red", "value": 14}]}}}},
        {"id": 8, "type": "stat", "title": "Burn Rate (6h)", "gridPos": {"x": 20, "y": 4, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sli:peerisland:error_ratio:rate6h / 0.001", "legendFormat": "", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"decimals": 1,
            "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 3}, {"color": "red", "value": 6}]}}}},

        {"id": 4, "type": "timeseries", "title": "SLO Burn Rate (fast: 1h, slow: 6h)", "gridPos": {"x": 0, "y": 8, "w": 24, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"expr": "sli:peerisland:error_ratio:rate1h / 0.001", "legendFormat": "burn rate 1h", "refId": "A"},
            {"expr": "sli:peerisland:error_ratio:rate6h / 0.001", "legendFormat": "burn rate 6h", "refId": "B"},
            {"expr": "vector(14)", "legendFormat": "fast-burn threshold (page)", "refId": "C"},
            {"expr": "vector(6)", "legendFormat": "slow-burn threshold (ticket)", "refId": "D"}],
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "lineWidth": 2, "fillOpacity": 8, "showPoints": "never", "spanNulls": true}},
            "overrides": [
              {"matcher": {"id": "byName", "options": "burn rate 1h"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]},
              {"matcher": {"id": "byName", "options": "burn rate 6h"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "orange"}}]},
              {"matcher": {"id": "byName", "options": "fast-burn threshold (page)"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-red"}}, {"id": "custom.lineStyle", "value": {"dash": [10, 10], "fill": "dash"}}]},
              {"matcher": {"id": "byName", "options": "slow-burn threshold (ticket)"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-orange"}}, {"id": "custom.lineStyle", "value": {"dash": [10, 10], "fill": "dash"}}]}]},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},

        {"id": 5, "type": "timeseries", "title": "SLI Error Ratio Over Time (multi-window)", "gridPos": {"x": 0, "y": 16, "w": 24, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"expr": "sli:peerisland:error_ratio:rate5m", "legendFormat": "5m", "refId": "A"},
            {"expr": "sli:peerisland:error_ratio:rate1h", "legendFormat": "1h", "refId": "B"},
            {"expr": "sli:peerisland:error_ratio:rate6h", "legendFormat": "6h", "refId": "C"},
            {"expr": "vector(0.001)", "legendFormat": "SLO budget (0.1%)", "refId": "D"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0,
            "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.001}, {"color": "red", "value": 0.014}]},
            "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 8, "showPoints": "never", "spanNulls": true, "thresholdsStyle": {"mode": "area"}}}},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}},

        {"id": 6, "type": "timeseries", "title": "p99 Latency vs 500ms SLO", "gridPos": {"x": 0, "y": 24, "w": 24, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[5m])) by (le))", "legendFormat": "p99", "refId": "A"},
            {"expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[5m])) by (le))", "legendFormat": "p95", "refId": "B"},
            {"expr": "vector(0.5)", "legendFormat": "SLO (500ms)", "refId": "C"}],
          "fieldConfig": {"defaults": {"unit": "s",
            "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.3}, {"color": "red", "value": 0.5}]},
            "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 8, "showPoints": "never", "spanNulls": true, "thresholdsStyle": {"mode": "line"}}},
            "overrides": [{"matcher": {"id": "byName", "options": "SLO (500ms)"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-red"}}, {"id": "custom.lineStyle", "value": {"dash": [10, 10], "fill": "dash"}}]}]},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}}
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-rollouts
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: PeerIsland
data:
  rollout-dashboard.json: |
    {
      "title": "PeerIsland Rollouts",
      "uid": "peerisland-rollouts",
      "description": "Canary rollout health: replica counts, error rate, latency and traces during deployments",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "15s",
      "time": {"from": "now-2h", "to": "now"},
      "timezone": "browser",
      "graphTooltip": 1,
      "tags": ["peerisland", "rollouts", "deployments"],
      "annotations": {"list": [{"name": "Alerts", "datasource": {"type": "datasource", "uid": "grafana"}, "enable": true, "iconColor": "red", "target": {"type": "tags", "tags": ["alert"]}}]},
      "links": [{"type": "dashboards", "title": "PeerIsland", "tags": ["peerisland"], "asDropdown": true, "includeVars": true, "keepTime": true}],
      "panels": [
        {"id": 1, "type": "stat", "title": "Frontend Ready Pods", "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sum(kube_replicaset_status_ready_replicas{namespace=\"peerisland\",replicaset=~\"frontend.*\"}) or vector(0)", "legendFormat": "ready", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 1}, {"color": "green", "value": 2}]}}}},
        {"id": 2, "type": "stat", "title": "Backend Ready Pods", "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sum(kube_replicaset_status_ready_replicas{namespace=\"peerisland\",replicaset=~\"backend.*\"}) or vector(0)", "legendFormat": "ready", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 1}, {"color": "green", "value": 2}]}}}},
        {"id": 3, "type": "stat", "title": "Error Rate (2m canary window)", "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "100 * sum(rate(http_requests_total{namespace=\"peerisland\",status_code=~\"5..\"}[2m])) / sum(rate(http_requests_total{namespace=\"peerisland\"}[2m]))", "legendFormat": "error %", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 5}]}}}},
        {"id": 4, "type": "stat", "title": "P99 Latency (2m canary window)", "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "histogram_quantile(0.99, sum by(le) (rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[2m])))", "legendFormat": "p99", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.5}, {"color": "red", "value": 1}]}}}},

        {"id": 5, "type": "timeseries", "title": "ReplicaSet Ready Pods Over Time", "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "kube_replicaset_status_ready_replicas{namespace=\"peerisland\"}", "legendFormat": "{{replicaset}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},
        {"id": 6, "type": "timeseries", "title": "Error Rate During Rollout", "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "100 * sum(rate(http_requests_total{namespace=\"peerisland\",status_code=~\"5..\"}[2m])) / sum(rate(http_requests_total{namespace=\"peerisland\"}[2m]))", "legendFormat": "error %", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percent",
            "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 5}]},
            "custom": {"drawStyle": "line", "lineWidth": 2, "fillOpacity": 12, "showPoints": "never", "spanNulls": true, "thresholdsStyle": {"mode": "line"}}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},

        {"id": 7, "type": "timeseries", "title": "Pod Restarts", "gridPos": {"x": 0, "y": 12, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"expr": "sum by(pod) (increase(kube_pod_container_status_restarts_total{namespace=\"peerisland\"}[5m]))", "legendFormat": "{{pod}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},
        {"id": 9, "type": "timeseries", "title": "Latency During Rollout", "gridPos": {"x": 8, "y": 12, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"expr": "histogram_quantile(0.50, sum by(le) (rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[2m])))", "legendFormat": "p50", "refId": "A"},
            {"expr": "histogram_quantile(0.95, sum by(le) (rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[2m])))", "legendFormat": "p95", "refId": "B"},
            {"expr": "histogram_quantile(0.99, sum by(le) (rate(http_request_duration_seconds_bucket{namespace=\"peerisland\"}[2m])))", "legendFormat": "p99", "refId": "C"}],
          "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}},
        {"id": 8, "type": "traces", "title": "Error Traces During Rollout", "gridPos": {"x": 16, "y": 12, "w": 8, "h": 8},
          "datasource": {"type": "tempo", "uid": "tempo"},
          "targets": [{"datasource": {"type": "tempo", "uid": "tempo"}, "queryType": "traceql",
            "query": "{ status = error && resource.service.name =~ \"peerisland.*\" }", "limit": 10, "refId": "A"}]},

        {"id": 10, "type": "logs", "title": "Warnings and Errors During Rollout", "gridPos": {"x": 0, "y": 20, "w": 24, "h": 10},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{namespace=\"peerisland\", level=~\"(?i)warn|error|fatal\"}", "refId": "A", "queryType": "range"}],
          "options": {"showTime": true, "wrapLogMessage": true, "enableLogDetails": true, "sortOrder": "Descending", "dedupStrategy": "none"}},
        {"id": 11, "type": "logs", "title": "Kubernetes Events", "gridPos": {"x": 0, "y": 30, "w": 24, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{service=\"kubernetes-events\"} |~ \"peerisland\"", "refId": "A", "queryType": "range"}],
          "options": {"showTime": true, "wrapLogMessage": true, "enableLogDetails": true, "sortOrder": "Descending", "dedupStrategy": "none"}}
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: PeerIsland
data:
  logs-dashboard.json: |
    {
      "title": "PeerIsland Logs",
      "uid": "peerisland-logs",
      "description": "Log volume by level, error rates, structured log search and Kubernetes events",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "graphTooltip": 1,
      "tags": ["peerisland", "logs", "loki"],
      "annotations": {"list": [{"name": "Alerts", "datasource": {"type": "datasource", "uid": "grafana"}, "enable": true, "iconColor": "red", "target": {"type": "tags", "tags": ["alert"]}}]},
      "links": [{"type": "dashboards", "title": "PeerIsland", "tags": ["peerisland"], "asDropdown": true, "includeVars": true, "keepTime": true}],
      "panels": [
        {"id": 1, "type": "stat", "title": "Error Log Rate (5m)", "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "sum(rate({namespace=\"peerisland\", level=~\"(?i)error\"}[5m])) or vector(0)", "legendFormat": "errors/s", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "short",
            "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 10}]}}}},
        {"id": 2, "type": "stat", "title": "Warn Log Rate (5m)", "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "sum(rate({namespace=\"peerisland\", level=~\"(?i)warn\"}[5m])) or vector(0)", "legendFormat": "warns/s", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "short",
            "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 5}, {"color": "orange", "value": 20}]}}}},
        {"id": 3, "type": "stat", "title": "Error Logs (5m)", "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "sum(count_over_time({namespace=\"peerisland\", level=~\"(?i)error|fatal\"}[5m])) or vector(0)", "legendFormat": "", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0,
            "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 20}]}}}},

        {"id": 4, "type": "timeseries", "title": "Log Volume by Level", "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [
            {"expr": "sum by(level) (rate({namespace=\"peerisland\"}[1m]))", "legendFormat": "{{level}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true, "stacking": {"mode": "normal"}}},
            "overrides": [
              {"matcher": {"id": "byName", "options": "error"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]},
              {"matcher": {"id": "byName", "options": "warn"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "orange"}}]},
              {"matcher": {"id": "byName", "options": "info"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "blue"}}]}]},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},
        {"id": 5, "type": "timeseries", "title": "Error Log Rate by Service", "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "sum by(service) (rate({namespace=\"peerisland\", level=~\"(?i)error|fatal\"}[1m]))", "legendFormat": "{{service}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["sum", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}},

        {"id": 6, "type": "logs", "title": "Backend Error Logs", "gridPos": {"x": 0, "y": 12, "w": 24, "h": 10},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{namespace=\"peerisland\", service=\"backend\", level=~\"(?i)error\"}", "refId": "A", "queryType": "range"}],
          "options": {"dedupStrategy": "none", "showLabels": false, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true, "enableLogDetails": true, "prettifyLogMessage": false}},

        {"id": 7, "type": "logs", "title": "All Warnings and Errors", "gridPos": {"x": 0, "y": 22, "w": 24, "h": 10},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{namespace=\"peerisland\", level=~\"(?i)warn|error|fatal\"}", "refId": "A", "queryType": "range"}],
          "options": {"dedupStrategy": "none", "showLabels": true, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true, "enableLogDetails": true, "prettifyLogMessage": false}},

        {"id": 8, "type": "logs", "title": "Kubernetes Events (peerisland)", "gridPos": {"x": 0, "y": 32, "w": 24, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{service=\"kubernetes-events\"} |~ \"peerisland\"", "refId": "A", "queryType": "range"}],
          "options": {"dedupStrategy": "none", "showLabels": false, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true, "enableLogDetails": true}}
      ]
    }
