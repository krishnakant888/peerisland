apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-infrastructure
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: PeerIsland
data:
  infrastructure-dashboard.json: |
    {
      "title": "PeerIsland Infrastructure",
      "uid": "peerisland-infra",
      "description": "Node conditions, compute, kubelet, volumes and peerisland workload resources",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "graphTooltip": 1,
      "tags": ["peerisland", "infrastructure", "k8s"],
      "annotations": {"list": [{"name": "Alerts", "datasource": {"type": "datasource", "uid": "grafana"}, "enable": true, "iconColor": "red", "target": {"type": "tags", "tags": ["alert"]}}]},
      "links": [{"type": "dashboards", "title": "PeerIsland", "tags": ["peerisland"], "asDropdown": true, "includeVars": true, "keepTime": true}],
      "panels": [
        {"id": 1, "type": "row", "title": "Conditions", "collapsed": false, "gridPos": {"x": 0, "y": 0, "w": 24, "h": 1}},

        {"id": 2, "type": "table", "title": "Node conditions",
          "gridPos": {"x": 0, "y": 1, "w": 24, "h": 6},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"refId": "A", "expr": "max by(node) (kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "instant": true, "format": "table"},
            {"refId": "B", "expr": "max by(node) (kube_node_status_condition{condition=\"MemoryPressure\",status=\"true\"})", "instant": true, "format": "table"},
            {"refId": "C", "expr": "max by(node) (kube_node_status_condition{condition=\"DiskPressure\",status=\"true\"})", "instant": true, "format": "table"},
            {"refId": "D", "expr": "max by(node) (kube_node_status_condition{condition=\"PIDPressure\",status=\"true\"})", "instant": true, "format": "table"},
            {"refId": "E", "expr": "count by(node) (kube_pod_info)", "instant": true, "format": "table"}],
          "transformations": [
            {"id": "merge", "options": {}},
            {"id": "organize", "options": {
              "excludeByName": {"Time": true},
              "renameByName": {"Value #A": "Ready", "Value #B": "Memory pressure", "Value #C": "Disk pressure", "Value #D": "PID pressure", "Value #E": "Pods"}}}],
          "fieldConfig": {
            "defaults": {"custom": {"align": "auto"}},
            "overrides": [
              {"matcher": {"id": "byName", "options": "Ready"}, "properties": [
                {"id": "thresholds", "value": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}},
                {"id": "custom.cellOptions", "value": {"type": "color-background"}}]},
              {"matcher": {"id": "byName", "options": "Memory pressure"}, "properties": [
                {"id": "thresholds", "value": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}},
                {"id": "custom.cellOptions", "value": {"type": "color-background"}}]},
              {"matcher": {"id": "byName", "options": "Disk pressure"}, "properties": [
                {"id": "thresholds", "value": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}},
                {"id": "custom.cellOptions", "value": {"type": "color-background"}}]},
              {"matcher": {"id": "byName", "options": "PID pressure"}, "properties": [
                {"id": "thresholds", "value": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}},
                {"id": "custom.cellOptions", "value": {"type": "color-background"}}]}]},
          "options": {"showHeader": true, "cellHeight": "sm"}},

        {"id": 3, "type": "row", "title": "Compute", "collapsed": false, "gridPos": {"x": 0, "y": 7, "w": 24, "h": 1}},

        {"id": 4, "type": "timeseries", "title": "CPU used / allocatable",
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"refId": "A", "expr": "sum by(node) (rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])) / on(node) sum by(node) (kube_node_status_allocatable{resource=\"cpu\"})", "legendFormat": "{{node}}"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0,
            "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 0.9}]},
            "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true, "thresholdsStyle": {"mode": "line"}}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},
        {"id": 5, "type": "timeseries", "title": "Memory used / allocatable",
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"refId": "A", "expr": "sum by(node) (container_memory_working_set_bytes{container!=\"\"}) / on(node) sum by(node) (kube_node_status_allocatable{resource=\"memory\"})", "legendFormat": "{{node}}"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0,
            "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 0.9}]},
            "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true, "thresholdsStyle": {"mode": "line"}}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},

        {"id": 6, "type": "timeseries", "title": "CPU requested / allocatable",
          "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"refId": "A", "expr": "sum by(node) (kube_pod_container_resource_requests{resource=\"cpu\"}) / on(node) sum by(node) (kube_node_status_allocatable{resource=\"cpu\"})", "legendFormat": "{{node}}"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0,
            "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},
        {"id": 7, "type": "timeseries", "title": "Memory requested / allocatable",
          "gridPos": {"x": 12, "y": 16, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"refId": "A", "expr": "sum by(node) (kube_pod_container_resource_requests{resource=\"memory\"}) / on(node) sum by(node) (kube_node_status_allocatable{resource=\"memory\"})", "legendFormat": "{{node}}"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0,
            "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},

        {"id": 8, "type": "timeseries", "title": "Pods per node",
          "gridPos": {"x": 0, "y": 24, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"refId": "A", "expr": "count by(node) (kube_pod_info)", "legendFormat": "{{node}}"}],
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},
        {"id": 9, "type": "timeseries", "title": "Network receive",
          "gridPos": {"x": 8, "y": 24, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"refId": "A", "expr": "sum by(node) (rate(container_network_receive_bytes_total[5m]))", "legendFormat": "{{node}}"}],
          "fieldConfig": {"defaults": {"unit": "Bps", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},
        {"id": 10, "type": "timeseries", "title": "Network transmit",
          "gridPos": {"x": 16, "y": 24, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"refId": "A", "expr": "sum by(node) (rate(container_network_transmit_bytes_total[5m]))", "legendFormat": "{{node}}"}],
          "fieldConfig": {"defaults": {"unit": "Bps", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},

        {"id": 11, "type": "row", "title": "Kubelet", "collapsed": false, "gridPos": {"x": 0, "y": 32, "w": 24, "h": 1}},

        {"id": 12, "type": "timeseries", "title": "Pod start duration p95",
          "gridPos": {"x": 0, "y": 33, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, sum by(node, le) (rate(kubelet_pod_start_duration_seconds_bucket[5m])))", "legendFormat": "{{node}}"}],
          "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},
        {"id": 13, "type": "timeseries", "title": "HPA Replicas (backend + frontend)",
          "gridPos": {"x": 8, "y": 33, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"refId": "A", "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"peerisland\",horizontalpodautoscaler=\"backend\"}", "legendFormat": "backend current"},
            {"refId": "B", "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"peerisland\",horizontalpodautoscaler=\"frontend\"}", "legendFormat": "frontend current"},
            {"refId": "C", "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"peerisland\",horizontalpodautoscaler=\"backend\"}", "legendFormat": "backend max"},
            {"refId": "D", "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"peerisland\",horizontalpodautoscaler=\"frontend\"}", "legendFormat": "frontend max"}],
          "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},
        {"id": 14, "type": "timeseries", "title": "Container Restarts",
          "gridPos": {"x": 16, "y": 33, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"refId": "A", "expr": "sum by(pod) (increase(kube_pod_container_status_restarts_total{namespace=\"peerisland\"}[5m]))", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},

        {"id": 15, "type": "row", "title": "Volumes", "collapsed": false, "gridPos": {"x": 0, "y": 41, "w": 24, "h": 1}},

        {"id": 16, "type": "bargauge", "title": "Volume free space",
          "gridPos": {"x": 0, "y": 42, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"refId": "A", "expr": "min by(namespace, persistentvolumeclaim) (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes)", "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "percentunit",
            "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 0.1}, {"color": "green", "value": 0.25}]}}},
          "options": {"displayMode": "gradient", "orientation": "horizontal", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "showUnfilled": true}},
        {"id": 17, "type": "timeseries", "title": "Volume used",
          "gridPos": {"x": 12, "y": 42, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [{"refId": "A", "expr": "max by(namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes)", "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}"}],
          "fieldConfig": {"defaults": {"unit": "bytes", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},

        {"id": 18, "type": "row", "title": "PeerIsland Workload", "collapsed": false, "gridPos": {"x": 0, "y": 50, "w": 24, "h": 1}},

        {"id": 19, "type": "timeseries", "title": "CPU (cores) vs request",
          "gridPos": {"x": 0, "y": 51, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"refId": "A", "expr": "sum by(pod) (rate(container_cpu_usage_seconds_total{namespace=\"peerisland\",container!=\"\"}[5m]))", "legendFormat": "{{pod}}"},
            {"refId": "B", "expr": "sum(kube_pod_container_resource_requests{namespace=\"peerisland\",resource=\"cpu\",container!=\"\"})", "legendFormat": "requests (total)"}],
          "fieldConfig": {"defaults": {"unit": "cores", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}},
        {"id": 20, "type": "timeseries", "title": "Memory working set vs limit",
          "gridPos": {"x": 12, "y": 51, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "targets": [
            {"refId": "A", "expr": "sum by(pod) (container_memory_working_set_bytes{namespace=\"peerisland\",container!=\"\"})", "legendFormat": "{{pod}}"},
            {"refId": "B", "expr": "sum(kube_pod_container_resource_limits{namespace=\"peerisland\",resource=\"memory\",container!=\"\"})", "legendFormat": "limits (total)"}],
          "fieldConfig": {"defaults": {"unit": "bytes", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": true}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}}
      ]
    }
