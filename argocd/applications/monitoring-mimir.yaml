apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-mimir
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # storage layer; Grafana datasources depend on this
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Multi-source: Helm chart from Grafana registry + values file from Git repo
  # Requires ArgoCD >= 2.6
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: mimir-distributed
      targetRevision: "5.3.0"
      helm:
        valueFiles:
          - $values/monitoring/mimir-values.yaml

    - repoURL: https://github.com/<YOUR_ORG>/peerisland.git
      targetRevision: HEAD
      ref: values   # named reference used as $values above

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # Mimir has large CRDs that exceed kubectl apply size limit
