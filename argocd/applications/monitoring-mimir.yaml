apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-mimir
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # storage layer; Grafana datasources depend on this
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/krishnakant888/peerisland.git
    targetRevision: main
    path: monitoring/mimir

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: mimir
      jsonPointers:
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/podManagementPolicy
        - /spec/revisionHistoryLimit
        - /spec/updateStrategy
        - /spec/volumeClaimTemplates/0/spec/volumeMode

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
