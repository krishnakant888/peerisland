# ── ArgoCD Application: monitoring-alloy ─────────────────────────────────────
#
# PURPOSE: Deploys Grafana Alloy as a DaemonSet — one pod per node — to collect
#   metrics AND logs AND forward OTLP traces from every node simultaneously.
#
# WHY ALLOY instead of Prometheus + Fluentd separately?
#   Alloy (formerly Grafana Agent Flow) is a single collector binary that replaces
#   three agents: it scrapes Prometheus metrics, tails pod logs, AND receives
#   OTLP traces. One DaemonSet instead of three means less memory per node and
#   one config surface.
#
# DATA FLOW:
#   Metrics: Alloy scrapes kubelet/pods → remote_write → Mimir (long-term storage)
#   Logs:    Alloy tails /var/log/pods → push → Loki
#   Traces:  App sends OTLP → alloy-otlp Service → Alloy → Tempo
#
# MULTI-SOURCE PATTERN: `sources` (plural) lets us reference the Helm chart from
#   grafana.github.io AND the values file from our git repo in a single Application.
#   The `ref: values` source is never deployed — it only provides the values file
#   path alias ($values) used in the helm.valueFiles field of the other source.
#
# SYNC WAVE 1: alloy-config ConfigMap (wave 0) must be deployed first so the
#   DaemonSet pods can mount it on first start. Wave ordering prevents crashloop.
#
# ignoreDifferences on updateStrategy: AKS sometimes patches DaemonSet
#   updateStrategy fields post-deploy. Without this, ArgoCD would loop forever
#   trying to revert the AKS-managed change.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # ConfigMap (wave 0) must exist first
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: "0.9.1"
      helm:
        valueFiles:
          - $values/monitoring/alloy-values.yaml

    - repoURL: https://github.com/krishnakant888/peerisland.git
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

  # Alloy runs as a DaemonSet â€” replica count is not applicable
  ignoreDifferences:
    - group: apps
      kind: DaemonSet
      jsonPointers:
        - /spec/updateStrategy
