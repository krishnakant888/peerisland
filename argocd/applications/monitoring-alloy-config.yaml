apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-alloy-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # ConfigMap must exist before the Alloy DaemonSet starts
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/<YOUR_ORG>/peerisland.git
    targetRevision: HEAD
    path: monitoring/alloy

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
