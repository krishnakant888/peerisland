# ── ArgoCD Application: cert-manager ─────────────────────────────────────────
#
# PURPOSE: Installs cert-manager — the TLS certificate lifecycle manager.
#   It automatically provisions, renews, and rotates TLS certificates for
#   all Ingress objects annotated with cert-manager.io/cluster-issuer.
#
# HOW IT WORKS:
#   1. cert-manager watches Ingress objects for the cluster-issuer annotation
#   2. It creates a Certificate resource and starts an ACME challenge
#   3. For HTTP-01: it creates a temporary Ingress path (/.well-known/acme-challenge/)
#      that Let's Encrypt / ZeroSSL hits to verify domain ownership
#   4. On success, it stores the signed cert in the secretName specified in the Ingress
#   5. It auto-renews ~30 days before expiry — zero manual intervention
#
# SYNC WAVE 0: Must be the FIRST thing deployed. cert-manager installs CRDs
#   (Certificate, ClusterIssuer, etc.) that ALL other components depend on.
#   If anything else deploys first and references these CRDs, ArgoCD fails.
#
# installCRDs: true — installs CRDs as part of the Helm release so they are
#   managed and upgraded automatically. Alternative is a separate CRD job.
#
# NODE PLACEMENT: system node pool — cert-manager is infrastructure, not an app.
#   The CriticalAddonsOnly toleration lets it schedule despite the system taint.
#
# ignoreDifferences: cert-manager-cainjector modifies webhook caBundle fields
#   after deploy (injects its own CA). ArgoCD sees this as drift and would
#   continuously try to revert it. ignoreDifferences tells ArgoCD to leave those
#   fields alone — this is a known cert-manager + ArgoCD integration pattern.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: "v1.16.2"
    helm:
      values: |
        installCRDs: true
        replicaCount: 1
        nodeSelector:
          kubernetes.azure.com/mode: system
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists
            effect: NoSchedule
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        webhook:
          nodeSelector:
            kubernetes.azure.com/mode: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
        cainjector:
          nodeSelector:
            kubernetes.azure.com/mode: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
          resources:
            requests:
              cpu: 20m
              memory: 64Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      # cert-manager-cainjector injects caBundle; admissionsenforcer is AKS's
      # built-in webhook reconciler. Both modify the webhooks field via SSA,
      # so we tell ArgoCD to ignore whatever those managers own.
      managedFieldsManagers:
        - cert-manager-cainjector
        - admissionsenforcer
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      managedFieldsManagers:
        - cert-manager-cainjector
        - admissionsenforcer
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
