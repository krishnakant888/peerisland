apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: "v1.16.2"
    helm:
      values: |
        installCRDs: true
        replicaCount: 1
        nodeSelector:
          kubernetes.azure.com/mode: system
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists
            effect: NoSchedule
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        webhook:
          nodeSelector:
            kubernetes.azure.com/mode: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
        cainjector:
          nodeSelector:
            kubernetes.azure.com/mode: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
          resources:
            requests:
              cpu: 20m
              memory: 64Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
