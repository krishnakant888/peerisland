apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # after mimir/loki/tempo datasources (wave 1)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: grafana
      targetRevision: "8.0.0"
      helm:
        valueFiles:
          - $values/monitoring/grafana-values.yaml
        # adminPassword is injected from a Kubernetes Secret at deploy time;
        # do not set it here — it would be committed to Git in plaintext.
        # Create the secret before first sync:
        #   kubectl create secret generic grafana-admin \
        #     --from-literal=admin-password=<value> -n monitoring

    - repoURL: https://github.com/<YOUR_ORG>/peerisland.git
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
