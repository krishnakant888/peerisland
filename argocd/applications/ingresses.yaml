# ── ArgoCD Application: ingresses ────────────────────────────────────────────
#
# PURPOSE: Deploys the ArgoCD-specific Ingress rules so the ArgoCD UI is
#   accessible at https://peerisland.centralindia.cloudapp.azure.com/argocd
#
# WHY A SEPARATE APP?
#   ArgoCD's own Ingress can't live inside the argocd-values.yaml Helm chart
#   with ServerSideApply, because Helm and SSA fight over field ownership.
#   Keeping it in a separate kustomize app (argocd/ingresses/) allows full SSA.
#
# SYNC WAVE 2: ingress-nginx (wave 1) must exist before this Ingress is applied,
#   otherwise the ingressClassName: nginx reference resolves to nothing and
#   ArgoCD marks the resource as degraded.
#
# ServerSideApply: true — required for Ingress objects with annotations managed
#   by cert-manager and nginx-ingress at the same time (each owns separate fields).
#   Without SSA these two controllers collide and the annotation resets on every sync.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingresses
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/krishnakant888/peerisland.git
    targetRevision: main
    path: argocd/ingresses

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
