# ── ArgoCD Application: monitoring-tempo ─────────────────────────────────────
#
# PURPOSE: Deploys Grafana Tempo — the distributed tracing backend.
#   App pods emit OpenTelemetry (OTLP) spans → Alloy receives on port 4317/4318
#   → Alloy forwards to Tempo → Grafana queries Tempo to show trace waterfalls.
#
# WHY DISTRIBUTED TRACING matters:
#   Logs and metrics tell you WHAT broke. Traces tell you WHERE in the call chain
#   it broke and HOW LONG each step took. For example: a p99 latency spike in
#   the backend alert fires — trace shows it's specifically the database query
#   in the /api/sessions endpoint, not the app logic. Without traces, you'd grep
#   logs for 20 minutes to find that.
#
# TRACE FLOW:
#   Backend/frontend → OTLP gRPC → alloy-otlp:4317 (ClusterIP Service)
#   → Alloy DaemonSet → Tempo ingest API → Tempo storage
#   → Grafana "Explore" → trace waterfall view
#
# CORRELATED OBSERVABILITY: Grafana links traces to logs automatically via
#   trace IDs in log lines (backend injects traceId into every structured log).
#   Click a slow span → see its logs without a separate query.
#
# ignoreDifferences:
#   - volumeClaimTemplates: immutable after StatefulSet creation; Tempo's chart
#     generates them dynamically — ArgoCD sees drift we can't fix without delete.
#   - ServiceAccount annotations: AKS Workload Identity injects the clientId
#     annotation post-deploy; ignoring prevents revert loop.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # storage layer; Grafana datasources depend on this
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: tempo
      targetRevision: "1.7.1"
      helm:
        valueFiles:
          - $values/monitoring/tempo-values.yaml

    - repoURL: https://github.com/krishnakant888/peerisland.git
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
    - group: ""
      kind: ServiceAccount
      jsonPointers:
        - /metadata/annotations

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
