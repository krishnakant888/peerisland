# ── ArgoCD Helm values ────────────────────────────────────────────────────────
#
# PURPOSE: Configures ArgoCD — the GitOps engine that watches this git repo and
#   continuously reconciles the cluster state to match what's in git.
#
# HOW ARGOCD WORKS (for interviewers):
#   1. app-of-apps.yaml defines a parent Application pointing to argocd/applications/
#   2. ArgoCD syncs the parent → discovers all child Application manifests
#   3. For each child app, ArgoCD clones the target path and applies manifests
#   4. It continuously diffs live cluster state vs. desired git state (every 3 min)
#   5. If drift detected: selfHeal=true means it auto-reverts unauthorized changes
#
# NODE PLACEMENT: system node only — ArgoCD is infrastructure, not an app.
#   The CriticalAddonsOnly toleration lets it run on system nodes despite the taint.
#   The YAML anchor (*systemNode) is reused on every component to keep it DRY.
#
# RESOURCE SIZING RATIONALE:
#   - controller (1500m/1Gi): reconciles all 15+ apps; memory grows with app count
#   - repoServer (1000m/512Mi): clones repos + runs kustomize; OOMKills cause global rpc errors
#   - server (500m/128Mi): just a UI + API proxy, very lightweight
#
# RBAC: policy.default: role:readonly — everyone can VIEW, only peerisland-admins
#   group (SSO-mapped) can deploy. This prevents read-only users from accidentally
#   triggering syncs or deletes.
#
# kustomize.buildOptions: "--load-restrictor LoadRestrictionsNone"
#   Required for overlays that use ../../ path traversal (k8s/overlays/production
#   references k8s/base/ which is two levels up). Without this flag, kustomize
#   refuses to load resources outside its own directory.
#
# HEALTH CHECKS (Lua scripts): the APIService health check is a custom Lua
#   function that tells ArgoCD how to determine if an APIService is healthy.
#   Without it, ArgoCD always shows APIService as "Unknown" because it doesn't
#   know the right status field to check.
#
# ArgoCD is platform infrastructure — it belongs on the system node alongside
# kube-system components, not competing with application workloads on user nodes.
# All components are pinned to the system node so they communicate locally
# (zero cross-node gRPC traffic) and the system node's spare capacity is used.

_systemNode: &systemNode
  nodeSelector:
    kubernetes.azure.com/mode: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
      effect: NoSchedule

# ── Application Controller (StatefulSet) ─────────────────────────────────────
controller:
  <<: *systemNode
  extraArgs:
    - --repo-server-timeout-seconds=60
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1500m"
      memory: 1Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      additionalLabels:
        release: kube-prometheus-stack

# ── Repo Server ───────────────────────────────────────────────────────────────
repoServer:
  <<: *systemNode
  replicas: 2
  extraArgs:
    - --parallelismlimit=5
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1000m"
      memory: 512Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      additionalLabels:
        release: kube-prometheus-stack

# ── ArgoCD Server (UI + API) ──────────────────────────────────────────────────
server:
  <<: *systemNode
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/ssl-passthrough: "false"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
      cert-manager.io/cluster-issuer: "letsencrypt"
    hosts:
      - peerisland.centralindia.cloudapp.azure.com
    paths:
      - /argocd
    pathType: Prefix
    tls:
      - secretName: argocd-tls
        hosts:
          - peerisland.centralindia.cloudapp.azure.com

# ── ApplicationSet Controller ─────────────────────────────────────────────────
applicationSet:
  <<: *systemNode
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      additionalLabels:
        release: kube-prometheus-stack

# ── Redis ─────────────────────────────────────────────────────────────────────
redis:
  <<: *systemNode
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

configs:
  params:
    server.insecure: false
    server.rootpath: /argocd
  cm:
    users.anonymous.enabled: "false"
    # Required for kustomize overlays that use ../../ path traversal (e.g. peerisland app)
    kustomize.buildOptions: "--load-restrictor LoadRestrictionsNone"
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_MutatingWebhookConfiguration: |
      managedFieldsManagers:
        - cert-manager-cainjector
        - admissionsenforcer
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_ValidatingWebhookConfiguration: |
      managedFieldsManagers:
        - cert-manager-cainjector
        - admissionsenforcer
    resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
    resource.customizations.health.apiregistration.k8s.io_APIService: |
      hs = {}
      if obj.status ~= nil then
        for i, condition in ipairs(obj.status.conditions or {}) do
          if condition.type == "Available" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message
              return hs
            else
              hs.status = "Degraded"
              hs.message = condition.message
              return hs
            end
          end
        end
      end
      hs.status = "Progressing"
      hs.message = "Waiting for APIService to become available"
      return hs

  rbac:
    policy.default: role:readonly
    policy.csv: |
      p, role:org-admin, applications, *, */*, allow
      p, role:org-admin, clusters, get, *, allow
      p, role:org-admin, repositories, *, *, allow
      g, peerisland-admins, role:org-admin

notifications:
  enabled: true
