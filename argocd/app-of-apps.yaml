# Root Application â€” syncs argocd/applications/ from Git.
# Apply this once manually:  kubectl apply -f argocd/app-of-apps.yaml
# After that ArgoCD owns everything, including the child Application objects.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/<YOUR_ORG>/peerisland.git
    targetRevision: main
    path: argocd/applications   # contains all child Application manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd           # Application CRs live in the argocd namespace

  syncPolicy:
    automated:
      prune: true       # removes Application objects deleted from Git
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
