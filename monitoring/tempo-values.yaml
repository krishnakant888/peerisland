# ── Tempo Helm values ─────────────────────────────────────────────────────────
#
# PURPOSE: Configures Grafana Tempo — the distributed tracing backend.  The app's
#   backend (src/telemetry.js) exports traces via OTLP gRPC to Alloy, which
#   forwards them to Tempo's OTLP receiver.  Grafana queries Tempo's API to render
#   trace waterfalls and service maps.
#
# MONOLITHIC mode: all Tempo components in one pod — same rationale as Mimir/Loki.
#
# OTLP receivers (gRPC :4317, HTTP :4318): accepts spans from Alloy.
#   The otel-collector-service.yaml in k8s/monitoring exposes Alloy's ports
#   to the peerisland namespace so app pods can send traces.
#
# retention: 72h = 3 days.  Traces are high-cardinality (every request is a span);
#   3 days is enough for post-incident debugging without excessive storage.
#
# metrics_generator: enabled — Tempo derives RED metrics (rate, errors, duration)
#   from spans and remote-writes them to Mimir.  This powers the service map
#   and span-level throughput dashboards in Grafana without instrumenting every
#   service with prom-client manually.
#
#   service_graphs: traces → dependency map (which service calls which)
#   span_metrics: traces → per-route latency histograms
#   Both push to mimir.monitoring.svc.cluster.local:8080/api/v1/push
#
# Tempo in monolithic mode — single binary, single AKS cluster
tempo:
  reportingEnabled: false

  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

  retention: 72h    # 3 days of traces — tune based on volume

  ingester:
    max_block_bytes: 1_073_741_824   # 1 GiB
    max_block_duration: 30m

  querier:
    max_concurrent_queries: 20

  limits_config:
    max_traces_per_user: 500000
    max_bytes_per_trace: 5000000

  compactor:
    ring:
      kvstore:
        store: memberlist

  metrics_generator:
    enabled: true
    remote_write:
      - url: http://mimir.monitoring.svc.cluster.local:8080/api/v1/push
    ring:
      kvstore:
        store: memberlist
    processor:
      service_graphs:
        enabled: true
        dimensions: [service.name, service.namespace]
      span_metrics:
        enabled: true
        dimensions: [service.name, http.route, http.status_code]

nodeSelector:
  kubernetes.azure.com/mode: user

persistence:
  enabled: true
  size: 10Gi
  storageClassName: managed-premium

service:
  type: ClusterIP
  port: 3100

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
