# Tempo in monolithic mode — single binary, single AKS cluster
tempo:
  reportingEnabled: false

  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

  retention: 72h    # 3 days of traces — tune based on volume

  ingester:
    max_block_bytes: 1_073_741_824   # 1 GiB
    max_block_duration: 30m

  querier:
    max_concurrent_queries: 20

  limits_config:
    max_traces_per_user: 500000
    max_bytes_per_trace: 5000000

  compactor:
    ring:
      kvstore:
        store: memberlist

  metrics_generator:
    enabled: true
    remote_write:
      - url: http://mimir.monitoring.svc.cluster.local:8080/api/v1/push
    ring:
      kvstore:
        store: memberlist
    processor:
      service_graphs:
        enabled: true
        dimensions: [service.name, service.namespace]
      span_metrics:
        enabled: true
        dimensions: [service.name, http.route, http.status_code]

persistence:
  enabled: true
  size: 10Gi
  storageClassName: managed-premium

service:
  type: ClusterIP
  port: 3100

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
