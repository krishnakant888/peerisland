replicas: 1

nodeSelector:
  kubernetes.azure.com/mode: user

admin:
  existingSecret: grafana-admin-secret
  userKey: admin-user
  passwordKey: admin-password

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: /metrics

persistence:
  enabled: true
  size: 5Gi
  storageClassName: managed-premium

initChownData:
  enabled: false   # fsGroup already makes the PVC writable; root chown fails with dropped caps

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

securityContext:
  runAsNonRoot: true
  runAsUser: 472
  runAsGroup: 472
  fsGroup: 472
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false   # Grafana writes its db and plugins under /var/lib/grafana (PVC)
  capabilities:
    drop: [ALL]

# Dashboard and alert sidecars — watch labeled ConfigMaps in monitoring namespace
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: monitoring
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true
  alerts:
    enabled: true
    label: grafana_alert
    labelValue: "1"
    searchNamespace: monitoring
  resources:
    requests: {cpu: 20m, memory: 128Mi}
    limits: {memory: 256Mi}

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      # Mimir — metrics (fully Prometheus-compatible, drop-in)
      - name: Mimir
        uid: mimir
        type: prometheus
        url: http://mimir.monitoring.svc.cluster.local:8080/prometheus
        access: proxy
        isDefault: true
        jsonData:
          httpMethod: POST
          prometheusType: Mimir
          timeInterval: "30s"
          manageAlerts: false
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo
              urlDisplayLabel: "View Trace"

      # Loki — logs with traceId derived field for logs→traces jump
      - name: Loki
        uid: loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
        jsonData:
          maxLines: 1000
          manageAlerts: false
          derivedFields:
            - name: trace_id
              matcherRegex: '"traceId":\s*"(\w+)"'
              url: "$${__value.raw}"
              datasourceUid: tempo
              urlDisplayLabel: "View Trace in Tempo"

      # Tempo — distributed traces (TraceQL)
      - name: Tempo
        uid: tempo
        type: tempo
        url: http://tempo.monitoring.svc.cluster.local:3100
        access: proxy
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            filterByTraceID: true
            filterBySpanID: false
          tracesToMetrics:
            datasourceUid: mimir
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            tags: [{key: "service.name", value: "service"}]
          serviceMap:
            datasourceUid: mimir
          search:
            hide: false
          nodeGraph:
            enabled: true

grafana.ini:
  server:
    domain: peerisland.centralindia.cloudapp.azure.com
    root_url: "https://peerisland.centralindia.cloudapp.azure.com/grafana/"
    serve_from_sub_path: true
  analytics:
    reporting_enabled: false
    check_for_updates: false
  log:
    mode: console
  log.console:
    format: json
  security:
    disable_gravatar: true
    cookie_secure: true
    strict_transport_security: true
  users:
    allow_sign_up: false
  auth.anonymous:
    enabled: false
  unified_alerting:
    enabled: true
  feature_toggles:
    enable: traceqlEditor tempoSearch

# Key Vault CSI driver — mounts grafana-admin-{user,password} from KV and syncs to grafana-admin-secret
# SecretProviderClass is in k8s/monitoring/secret-provider-grafana.yaml
extraVolumes:
  - name: grafana-kv-secrets
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: grafana-admin-keyvault

extraVolumeMounts:
  - name: grafana-kv-secrets
    mountPath: /mnt/grafana-secrets
    readOnly: true

ingress:
  enabled: false   # managed by argocd/ingresses/grafana-ingress.yaml
