# ── Loki Helm values ──────────────────────────────────────────────────────────
#
# PURPOSE: Configures Grafana Loki — the log aggregation backend.  Alloy collects
#   container logs from every pod via log discovery, normalises the log level label,
#   and remote-writes to Loki's push API.  Grafana queries Loki for log panels.
#
# SingleBinary mode: all Loki components (ingester, querier, compactor) in one pod.
#   Same tradeoff as Mimir: simpler to operate at small scale, easy to evolve to
#   distributed mode (SimpleScalable or microservices) by changing deploymentMode.
#
# FILESYSTEM storage with TSDB schema (v13):
#   Logs are stored as TSDB blocks on the PVC (30Gi, managed-premium).
#   schema v13 is the most efficient current schema — uses TSDB for the index
#   instead of the older Bigtable/Cassandra-style index.
#
# retention_period: 336h = 14 days.  Tune based on audit/compliance requirements.
#   At 16 MB/s ingestion rate cap, 14 days of logs at moderate log volume easily
#   fits in 30Gi with Loki's compression.
#
# Disabled components:
#   backend/read/write replicas → 0: SimpleScalable mode components; not needed
#     in SingleBinary mode where everything runs in the singleBinary pod.
#   gateway: disabled because Alloy sends directly to Loki's push API endpoint.
#   selfMonitoring / lokiCanary: Loki's internal monitoring agent and canary;
#     disabled because Alloy already scrapes Loki's /metrics endpoint.
#
# Loki in single-binary mode
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 336h   # 14 days
    ingestion_rate_mb: 16
    per_stream_rate_limit: 5MB

singleBinary:
  replicas: 1
  nodeSelector:
    kubernetes.azure.com/mode: user
  persistence:
    enabled: true
    size: 30Gi
    storageClass: managed-premium
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Disable distributed components
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Disable built-in Grafana agent (we use Alloy)
gateway:
  enabled: false
monitoring:
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false
test:
  enabled: false
