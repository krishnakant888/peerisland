alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
    receivers:
      - name: 'null'

server:
  retention: "30d"
  persistentVolume:
    enabled: true
    size: 20Gi
    storageClass: "managed-premium"
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

serverFiles:
  alerting_rules.yml:
    groups:
      - name: peerisland-alerts
        rules:
          - alert: HighCPUUsage
            expr: sum(rate(container_cpu_usage_seconds_total{namespace="peerisland"}[5m])) by (pod) > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage on {{ $labels.pod }}"
              description: "Pod {{ $labels.pod }} CPU > 80% for 5 minutes"

          - alert: HighMemoryUsage
            expr: sum(container_memory_working_set_bytes{namespace="peerisland"}) by (pod) / sum(container_spec_memory_limit_bytes{namespace="peerisland"}) by (pod) > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage on {{ $labels.pod }}"

          - alert: HighErrorRate
            expr: sum(rate(http_requests_total{namespace="peerisland",status_code=~"5.."}[5m])) / sum(rate(http_requests_total{namespace="peerisland"}[5m])) > 0.05
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Error rate > 5% in peerisland namespace"

          - alert: PodRestartingFrequently
            expr: increase(kube_pod_container_status_restarts_total{namespace="peerisland"}[1h]) > 5
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} restarted {{ $value }} times in 1h"

          - alert: HighP99Latency
            expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace="peerisland"}[5m])) by (le)) > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "P99 latency > 2s in peerisland"

extraScrapeConfigs: |
  - job_name: 'peerisland-backend'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ['peerisland']
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
