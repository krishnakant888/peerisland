# ── kube-state-metrics Helm values ────────────────────────────────────────────
#
# PURPOSE: Exposes Kubernetes object state as Prometheus metrics — replica counts,
#   pod phases, HPA min/max/current, PVC conditions, etc.  These are the metrics
#   that fill the "infrastructure" sections of Grafana dashboards.
#
# WHY fullnameOverride: kube-state-metrics?
#   The Helm chart generates names like "<release>-kube-state-metrics" which vary
#   by release name.  Alloy's metric scrape config references the Service by name
#   (config.alloy: kubernetes.service_discovery).  Pinning the name makes config
#   environment-agnostic — the same config.alloy works regardless of Helm release name.
#
# COLLECTORS: Only the resource types that dashboards actually query are enabled.
#   Full kube-state-metrics scrapes ALL API objects — that inflates cardinality
#   significantly in a large cluster.  Explicitly listing only what's needed keeps
#   metric cardinality low and query performance high.
#
# seccompProfile removed (see comment): kube-state-metrics chart 5.27.0 defaults
#   to seccompProfile:RuntimeDefault which requires the node OS to support it.
#   On some AKS node image versions this causes an immediate crash (exit code 2).
#   Dropping the seccomp profile preserves runAsNonRoot + runAsUser hardening.
#
fullnameOverride: kube-state-metrics

replicas: 1

# Expose a named port "http-metrics" so Alloy's named_metrics_port scraper picks it up
service:
  port: 8080
  targetPort: 8080

# Resources that the dashboards actually query — keep cardinality low
collectors:
  - deployments
  - daemonsets
  - statefulsets
  - replicasets
  - pods
  - nodes
  - horizontalpodautoscalers
  - persistentvolumeclaims
  - namespaces
  - services
  - endpoints

podAnnotations:
  prometheus.io/scrape: "false"   # Alloy uses service discovery, not annotation scrape

# chart 5.27.0 defaults to seccompProfile:RuntimeDefault which is not supported
# on all AKS node pools and causes an immediate crash (exit code 2).
# Keep user/group hardening but omit the seccomp profile.
podSecurityContext:
  fsGroup: 65534
  runAsGroup: 65534
  runAsNonRoot: true
  runAsUser: 65534

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
