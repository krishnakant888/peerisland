apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: monitoring
  labels:
    app.kubernetes.io/name: mimir
spec:
  selector:
    app.kubernetes.io/name: mimir
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
    - name: grpc
      port: 9095
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: mimir-headless
  namespace: monitoring
  labels:
    app.kubernetes.io/name: mimir
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mimir
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
