# ── Mimir Services ────────────────────────────────────────────────────────────
#
# PURPOSE: Two services for Mimir — a standard ClusterIP for client access and
#   a headless service required by the StatefulSet.
#
# mimir (ClusterIP):
#   - port 8080 (http-metrics): Alloy remote-writes metrics here via HTTP POST
#     to /api/v1/push.  Grafana queries via /prometheus (Prometheus-compatible API).
#     Prometheus adapter also points here (see prometheus-adapter-values.yaml).
#   - port 9095 (gRPC): used for inter-component communication in distributed mode;
#     included for forward-compatibility if Mimir is later split into microservices.
#
# mimir-headless (clusterIP: None):
#   Required by the StatefulSet spec (serviceName: mimir-headless).
#   Kubernetes uses it to give each pod a stable DNS name:
#     mimir-0.mimir-headless.monitoring.svc.cluster.local
#   In single-binary mode there's only mimir-0, but the headless service is
#   still required for the StatefulSet controller to function correctly.
#
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: monitoring
  labels:
    app.kubernetes.io/name: mimir
spec:
  selector:
    app.kubernetes.io/name: mimir
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
    - name: grpc
      port: 9095
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: mimir-headless
  namespace: monitoring
  labels:
    app.kubernetes.io/name: mimir
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mimir
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
