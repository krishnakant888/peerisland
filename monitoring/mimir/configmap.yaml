apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: monitoring
data:
  mimir.yaml: |
    target: all
    multitenancy_enabled: false

    server:
      http_listen_port: 8080
      grpc_listen_port: 9095
      log_level: info

    memberlist:
      join_members:
        - localhost

    ingester:
      ring:
        replication_factor: 1

    distributor:
      ring:
        instance_addr: 127.0.0.1

    store_gateway:
      sharding_ring:
        replication_factor: 1

    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /data/blocks
      tsdb:
        dir: /data/tsdb

    compactor:
      data_dir: /data/compactor
      blocks_retention_period: 720h

    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/ruler
