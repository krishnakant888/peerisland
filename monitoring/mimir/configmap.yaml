apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: monitoring
data:
  mimir.yaml: |
    target: all
    multitenancy_enabled: false

    server:
      http_listen_port: 8080
      grpc_listen_port: 9095
      log_level: info

    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /data/blocks

    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/ruler

    compactor:
      blocks_retention_period: 720h
