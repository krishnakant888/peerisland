apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: monitoring
data:
  mimir.yaml: |
    # Single-binary mode — all components in one process
    target: all,alertmanager

    common:
      storage:
        backend: filesystem

    blocks_storage:
      filesystem:
        dir: /data/blocks

    alertmanager_storage:
      filesystem:
        dir: /data/alertmanager

    ruler_storage:
      filesystem:
        dir: /data/ruler

    compactor:
      blocks_retention_period: 720h   # 30 days

    limits:
      ingestion_rate: 10000
      max_global_series_per_user: 1500000

    alertmanager:
      external_url: "http://mimir.monitoring.svc.cluster.local:8080/alertmanager"
    alertmanager_config:
      route:
        receiver: "null"
      receivers:
        - name: "null"

    ruler:
      rule_path: /data/rules
      alertmanager_url: "http://localhost:8080/alertmanager"

    # Disable multi-tenancy — single tenant cluster
    multitenancy_enabled: false

    server:
      http_listen_port: 8080
      grpc_listen_port: 9095
      log_level: info
